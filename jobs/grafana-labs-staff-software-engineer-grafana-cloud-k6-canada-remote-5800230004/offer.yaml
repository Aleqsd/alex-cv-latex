job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;&amp;nbsp;&lt;/h2&gt; &lt;h3&gt;&lt;strong&gt;This\
  \ is a remote opportunity, and we would be interested in applicants in Canadian\
  \ time zones.&amp;nbsp;&amp;nbsp;&lt;/strong&gt;&lt;/h3&gt; &lt;h3&gt;The Opportunity&amp;nbsp;&lt;/h3&gt;\
  \ &lt;p&gt;We are the team behind &lt;a href=&quot;https://grafana.com/oss/k6/&quot;&gt;Grafana\
  \ k6&lt;/a&gt;, &lt;a href=&quot;https://grafana.com/products/cloud/k6/&quot;&gt;Grafana\
  \ Cloud k6&lt;/a&gt;, and &lt;a href=&quot;https://grafana.com/products/cloud/synthetic-monitoring/&quot;&gt;Grafana\
  \ Cloud Synthetics&lt;/a&gt;, used by teams globally to ensure resilient, high-performing\
  \ systems.&amp;nbsp; This opportunity is with the Grafana Cloud k6 squad, who build\
  \ and operate our performance testing product. Grafana Cloud k6 is built around\
  \ the OSS k6 and targeted at users looking to run performance tests at scale. Our\
  \ enterprise and SaaS offerings allow customers to load test their systems by running\
  \ distributed tests from 15+ regions worldwide, using hundreds of thousands of virtual\
  \ users sending millions of requests per second. We ingest huge volumes of data\
  \ generated by k6, which can be used to view, correlate and analyze metrics from\
  \ each test.&lt;/p&gt; &lt;p&gt;k6 is a product used by other engineers, and as\
  \ such, we are looking for people enthusiastic about building high-quality tools\
  \ they would want to use themselves. Due to our small teams and fast development\
  \ pace, you will have a substantial and immediate impact on how the end product\
  \ is architected, developed, and how the engineering team operates.&lt;/p&gt; &lt;p&gt;Your\
  \ role will focus on establishing and scaling a cross-team culture of engineering\
  \ excellence by setting standards and guiding adoption of strong DevOps/SRE practices\
  \ that improve reliability, availability, and operational ownership. As this foundation\
  \ matures, the role is expected to expand into broader application and product development\
  \ leadership, contributing architectural and technical depth beyond operational\
  \ excellence.&lt;/p&gt; &lt;h3&gt;What will you be doing?&amp;nbsp;&lt;/h3&gt; &lt;ul&gt;\
  \ &lt;li&gt;Build and scale a strong culture of operational excellence by defining\
  \ standards and coaching teams to own reliability and availability.&lt;/li&gt; &lt;li&gt;Drive\
  \ mature DevOps/SRE practices, including incident response and PIRs, on-call readiness,\
  \ runbooks, alerting, observability, and release/change management.&lt;/li&gt; &lt;li&gt;Establish\
  \ reliability frameworks such as SLIs/SLOs and error budgets, and use them to guide\
  \ prioritization and engineering trade-offs.&lt;/li&gt; &lt;li&gt;Provide visibility\
  \ into system health through clear operational metrics and reliability reporting.&lt;/li&gt;\
  \ &lt;li&gt;Guide teams in the design, development, evolution, and operation of\
  \ large-scale, distributed cloud systems.&lt;/li&gt; &lt;li&gt;Influence product\
  \ and system direction through design reviews, architectural discussions, and cross-team\
  \ collaboration.&lt;/li&gt; &lt;li&gt;Share knowledge through clear, high-quality\
  \ documentation and technical communication\u2014internally and, where appropriate,\
  \ externally\u2014to help teams build and operate systems more effectively.&lt;/li&gt;\
  \ &lt;li&gt;As the reliability foundation matures, grow into broader application\
  \ and product development leadership, contributing architectural and technical depth\
  \ beyond operations.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We invest heavily in developer\
  \ productivity. You can use modern AI coding assistants as part of your daily workflow\
  \ (your choice of tools, within security guidelines), backed by a company-funded\
  \ usage budget so you can iterate quickly without unnecessary friction.&lt;br&gt;&lt;br&gt;We\
  \ encourage pragmatic AI-assisted development: faster prototyping, test generation,\
  \ refactors, documentation, and incident follow-ups\u2014always paired with strong\
  \ code review and quality standards.&lt;br&gt;&lt;br&gt;You\u2019ll also have access\
  \ to frontier models (e.g., GPT-Codex 5/3, Claude Opus 4.6, Gemini 3 Pro).&lt;/p&gt;\
  \ &lt;h3&gt;Requirements:&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Strong experience with\
  \ DevOps/SRE practices, including operating and evolving production systems at scale&lt;/li&gt;\
  \ &lt;li&gt;Strong programming background in a modern language (Python and Go are\
  \ primary, but prior experience is not required)&lt;/li&gt; &lt;li&gt;Experience\
  \ designing, building, and operating large-scale distributed systems&lt;/li&gt;\
  \ &lt;li&gt;Strong understanding of reliability engineering concepts (e.g. incident\
  \ management, observability, and failure modes)&lt;/li&gt; &lt;li&gt;Experience\
  \ with test automation, including performance and functional testing&lt;/li&gt;\
  \ &lt;li&gt;Ability to influence engineering practices through clear technical communication,\
  \ reviews, and collaboration&lt;/li&gt; &lt;li&gt;Strong interpersonal skills and\
  \ ability to work effectively across teams&lt;/li&gt; &lt;li&gt;Familiarity with\
  \ modern software engineering processes and delivery practices&lt;/li&gt; &lt;li&gt;Self-driven\
  \ and comfortable operating with a high degree of autonomy and ambiguity&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;Bonus Points For:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience\
  \ with containerized and cloud-native systems (Docker, Kubernetes, AWS)&lt;/li&gt;\
  \ &lt;li&gt;Familiarity with observability tooling and platforms (e.g. the Grafana\
  \ stack)&lt;/li&gt; &lt;li&gt;Experience working with Python, Go, JavaScript and/or\
  \ Jsonnet&amp;nbsp;&lt;/li&gt; &lt;li&gt;Experience building or operating event-driven\
  \ or asynchronous systems&lt;/li&gt; &lt;li&gt;Experience defining or applying SLIs/SLOs,\
  \ error budgets, or reliability metrics&lt;/li&gt; &lt;li&gt;Interest in, or experience\
  \ with, building testing frameworks or developer tooling&lt;/li&gt; &lt;/ul&gt;\
  \ &lt;div class=&quot;content-conclusion&quot;&gt; &lt;div&gt; &lt;p class=&quot;p1&quot;&gt;In\
  \ Canada, the Base compensation range for this role is CAD &lt;span data-sheets-root=&quot;1&quot;&gt;186,368&lt;/span&gt;\
  \ - CAD &lt;span data-sheets-root=&quot;1&quot;&gt;223,642&lt;/span&gt;.&amp;nbsp;\
  \ Actual compensation may vary based on level, experience, and skillset as assessed\
  \ in the interview process. Benefits include equity, bonus (if applicable) and other\
  \ benefits listed &lt;a href=&quot;https://grafana.com/about/careers/#jobs&quot;&gt;&lt;span\
  \ class=&quot;s1&quot;&gt;here&lt;/span&gt;&lt;/a&gt;.&lt;/p&gt; &lt;p class=&quot;p1&quot;&gt;&lt;em&gt;*Compensation\
  \ ranges are country specific. If you are applying for this role from a different\
  \ location than listed above, your recruiter will discuss your specific market\u2019\
  s defined pay range &amp;amp; benefits at the beginning of the process&lt;/em&gt;&lt;/p&gt;\
  \ &lt;/div&gt; &lt;/div&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;div&gt;\
  \ &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation ranges\
  \ are country specific. If you are applying for this role from a different location\
  \ than listed above, your recruiter will discuss your specific market\u2019s defined\
  \ pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
