job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;h2&gt;&lt;strong&gt;About\
  \ Remote&lt;/strong&gt;&lt;/h2&gt; &lt;div&gt;&lt;span style=&quot;font-size: 12pt;\
  \ font-family: helvetica, arial, sans-serif;&quot;&gt;Remote is solving modern organizations\u2019\
  \ biggest challenge \u2013 navigating global employment compliantly with ease. We\
  \ make it possible for businesses of all sizes to recruit, pay, and manage international\
  \ teams. With our core values at heart and future focused work culture, our team\
  \ works tirelessly on ambitious problems, asynchronously, around the world. You\
  \ can find Remoters working from 6 different continents (Antarctica left to go!)\
  \ and all of our positions are fully remote.&lt;br&gt;&lt;br&gt;&lt;span class=&quot;discussion-id-2f7cb4da-dab4-8068-a80f-001c50b2d808\
  \ suggestion-update notion-enable-hover&quot; data-token-index=&quot;0&quot;&gt;With\
  \ Innovation as one of the core values, we have built Automation and AI capabilities\
  \ into the requirements for every role.&lt;/span&gt;&lt;br&gt;&lt;br&gt;We encourage\
  \ every member of the Remote team to bring their talents, experiences and culture\
  \ to the table to help us build the best-in-class HR platform.&lt;/span&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;span style=&quot;font-size: 12pt;\
  \ font-family: helvetica, arial, sans-serif;&quot;&gt;If you are energetic, curious,\
  \ motivated and ambitious, be part of our world. Apply now and define the future\
  \ of work!&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;h1&gt;The Position&lt;/h1&gt;\
  \ &lt;p&gt;A Team Leader is responsible for all the work of a team and the spokesperson\
  \ for everyone in it. They are expected to manage the team dynamics and always bring\
  \ the best in everyone. A team leader is not expected to be the best in a team but\
  \ rather help others become the best version there is and gear the team towards\
  \ optimised execution.&lt;/p&gt; &lt;h1&gt;Key Responsibilities&lt;/h1&gt; &lt;ul&gt;\
  \ &lt;li&gt;Manage a small product team of 3-5 engineers (backend and frontend).&lt;/li&gt;\
  \ &lt;li&gt;30% of the time spent doing management work. Outside of that actively\
  \ participates in product development in their team.&lt;/li&gt; &lt;li&gt;Be involved\
  \ in hiring processes for their own team and potentially help out their peers.&lt;/li&gt;\
  \ &lt;li&gt;In addition to being involved in hiring, also being responsible for\
  \ the onboarding process of new engineers.&lt;/li&gt; &lt;li&gt;By being the spokesperson\
  \ for everyone in their team they are expected to manage the team dynamics and bring\
  \ out the best in them.&lt;/li&gt; &lt;li&gt;Giving continuous and constructive\
  \ feedback on all the things.&lt;/li&gt; &lt;li&gt;Helps the team to grow continuously\
  \ as a group and is responsible for each direct report\u2019s career.&lt;/li&gt;\
  \ &lt;li&gt;Provide guidance and coaching to the team.&lt;/li&gt; &lt;/ul&gt; &lt;h1&gt;Requirements&lt;/h1&gt;\
  \ &lt;ul&gt; &lt;li&gt;Managed an engineering team of at least 2 people.&lt;/li&gt;\
  \ &lt;li&gt;Extensive experience with Backend (Elixir/Phoenix).&lt;/li&gt; &lt;li&gt;Commitment\
  \ to promoting all of Remote&#39;s values within the team and the greater organisation.&lt;/li&gt;\
  \ &lt;li&gt;Solid communication skills.&lt;/li&gt; &lt;li&gt;Solid knowledge of\
  \ engineering and development principles and best practices.&lt;/li&gt; &lt;li&gt;Proven\
  \ organizational skills with attention to detail.&lt;/li&gt; &lt;li&gt;Focused on\
  \ efficient processes with a kind, people-first approach.&lt;/li&gt; &lt;li&gt;Being\
  \ able to inspire others and instill confidence.&lt;/li&gt; &lt;li&gt;Good understanding\
  \ of team dynamics.&lt;/li&gt; &lt;li&gt;Ambitious and intentional about diversity,\
  \ equality and inclusion.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Practicals&lt;/strong&gt;&lt;/h2&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong&gt;You&#39;ll report to:&lt;/strong&gt; Engineering\
  \ Manager&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Direct reports:&lt;/strong&gt; 2-5\
  \ Engineers&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Team:&lt;/strong&gt; Engineering&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Location&lt;/strong&gt;: Anywhere in the world&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Start date:&lt;/strong&gt; As soon as possible&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Application process&lt;/strong&gt;&lt;/h2&gt;\
  \ &lt;p&gt;Roughly 6 hours across 6 weeks&lt;/p&gt; &lt;ol&gt; &lt;li&gt;Interview\
  \ with recruiter&lt;/li&gt; &lt;li&gt;Interview with Hiring Manager&lt;/li&gt; &lt;li&gt;(async)\
  \ Code challenge + review&lt;/li&gt; &lt;li&gt;Interview with team members&lt;/li&gt;\
  \ &lt;li&gt;Bar Raiser Interview&lt;/li&gt; &lt;li&gt;Executive Interview&lt;/li&gt;\
  \ &lt;li&gt;Offer and &lt;a href=&quot;https://www.notion.so/96e108c037b8423cbd4c3f07a1f9b38b?pvs=21&quot;&gt;Prior\
  \ employment verification check&lt;/a&gt; (Read more at &lt;a href=&quot;http://remote.com/employment-checks&quot;&gt;remote.com/employment-checks&lt;/a&gt;)&lt;/li&gt;\
  \ &lt;/ol&gt;&lt;div class=&quot;content-pay-transparency&quot;&gt;&lt;div class=&quot;pay-input&quot;&gt;&lt;div\
  \ class=&quot;description&quot;&gt;&lt;p&gt;Remote&#39;s &lt;a href=&quot;https://www.notion.so/remotecom/people-Total-Rewards-1945bce8d3924ece9421ba8630f57b0c&quot;&gt;Total\
  \ Rewards philosophy&lt;/a&gt; is to ensure fair, unbiased compensation and fair\
  \ &lt;span class=&quot;link-annotation-unknown-block-id-1691622878&quot;&gt;equity&lt;/span&gt;&lt;span\
  \ class=&quot;discussion-level-1 discussion-id-f2a82bc4-09e4-4a71-ad93-755b1d26a690\
  \ notion-enable-hover&quot; data-token-index=&quot;3&quot;&gt; pay &lt;/span&gt;along\
  \ with competitive benefits in all locations in which we operate. We do not agree\
  \ to or encourage cheap-labor practices and therefore we ensure to pay above in-location\
  \ rates. We hope to inspire other companies to support global talent-hiring and\
  \ bring local wealth to developing countries.&lt;/p&gt; &lt;p&gt;At first glance\
  \ our salary bands seem quite wide - here is some context. At Remote we have international\
  \ operations and a globally distributed workforce.&amp;nbsp; We use geo ranges to\
  \ consider geographic pay differentials as part of our global compensation strategy\
  \ to remain competitive in various markets while we hiring globally.&lt;br&gt;&lt;br&gt;Our\
  \ salary ranges are determined by role, level and location, and our job titles may\
  \ span more than one career level. The actual base pay for the successful candidate\
  \ in this role is dependent upon many factors such as location, transferable or\
  \ job-related skills, work experience, relevant training, business needs, and market\
  \ demands. The base salary range may be subject to change.&lt;br&gt;&lt;br&gt;&lt;em\
  \ data-stringify-type=&quot;italic&quot;&gt;At Remote, we foster internal mobility\
  \ as a key element of our culture of employee growth and development, supported\
  \ by a compensation philosophy that guarantees pay equity and fairness. Therefore,\
  \ all compensation changes associated with an internal move will be reviewed by\
  \ the Total Rewards &amp;amp; People Enablement team on a case by case basis.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;div\
  \ class=&quot;title&quot;&gt;The annual salary range for this full-time position\
  \ is&lt;/div&gt;&lt;div class=&quot;pay-range&quot;&gt;&lt;span&gt;$75,450&lt;/span&gt;&lt;span\
  \ class=&quot;divider&quot;&gt;&amp;mdash;&lt;/span&gt;&lt;span&gt;$169,700 USD&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div\
  \ class=&quot;content-conclusion&quot;&gt;&lt;h2&gt;&lt;strong&gt;Benefits&lt;/strong&gt;&lt;/h2&gt;\
