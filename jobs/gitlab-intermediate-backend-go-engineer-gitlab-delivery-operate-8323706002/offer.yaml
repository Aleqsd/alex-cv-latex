job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;GitLab is\
  \ the intelligent orchestration platform for DevSecOps. GitLab enables organizations\
  \ to increase developer productivity, improve operational efficiency, reduce security\
  \ and compliance risk, and accelerate digital transformation. More than 50 million\
  \ registered users and more than 50% of the Fortune 100* trust GitLab to ship better,\
  \ more secure software faster.&lt;/p&gt; &lt;p&gt;The same principles built into\
  \ our products are reflected in how our team works: we embrace AI as a core productivity\
  \ multiplier, with all team members expected to incorporate AI into their daily\
  \ workflows to drive efficiency, innovation, and impact. GitLab is where careers\
  \ accelerate, innovation flourishes, and every voice is valued. Our high-performance\
  \ culture is driven by our &lt;a href=&quot;https://handbook.gitlab.com/handbook/values/&quot;&gt;values&lt;/a&gt;\
  \ and continuous knowledge exchange, enabling our team members to reach their full\
  \ potential while collaborating with industry leaders to solve complex problems.\
  \ &lt;a href=&quot;https://www.youtube.com/watch?v=OuZIb5zszQI&quot;&gt;Co-create\
  \ the future with us&lt;/a&gt; as we build technology that transforms how the world\
  \ develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;Fortune 500\xAE is a registered\
  \ trademark of Fortune Media IP Limited, used under license. Claim based on GitLab\
  \ data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500\
  \ list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated\
  \ with, and do not endorse products or services of GitLab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;An\
  \ overview of this role&lt;/h2&gt; &lt;p&gt;As a Backend Engineer on the GitLab\
  \ Delivery Operate team, you\u2019ll focus on delivering and supporting GitLab for\
  \ self-managed customers by building and maintaining the infrastructure, tooling,\
  \ and automation that power our deployment methods. You\u2019ll work across Omnibus\
  \ GitLab, GitLab Helm Charts, the GitLab Environment Toolkit (GET), and the GitLab\
  \ Operator to ensure GitLab is easy to install, upgrade, and operate in diverse,\
  \ production-grade environments. In this role, you\u2019ll collaborate closely with\
  \ Distribution Engineers, Site Reliability Engineers, Release Managers, Security,\
  \ and Development teams to keep deployments secure, scalable, and reliable, so customers\
  \ can run GitLab with confidence on their own platforms.&lt;/p&gt; &lt;p&gt;Some\
  \ examples of our projects:&lt;/p&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Evolving\
  \ Omnibus, Helm Charts, GET, and the GitLab Operator to support new GitLab features\
  \ and architectures&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Improving installation,\
  \ upgrade, and validation automation for large-scale, self-managed GitLab deployments&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;What you\u2019ll do&lt;/h2&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Maintain\
  \ and evolve the Omnibus GitLab package so it reliably integrates GitLab components\
  \ for self-managed deployments.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Contribute\
  \ to the design, development, and maintenance of GitLab Helm Charts to support scalable,\
  \ production-ready Kubernetes deployments.&lt;/li&gt; &lt;li value=&quot;3&quot;&gt;Enhance\
  \ and support the GitLab Environment Toolkit (GET) and validated reference architectures\
  \ used by enterprise and internal users.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;Support\
  \ and improve the GitLab Operator to enable Kubernetes-native lifecycle management\
  \ for GitLab installations.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;Improve the\
  \ installation, upgrade, and day\u2011to\u2011day operation experience across all\
  \ supported self-managed platforms.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;Collaborate\
  \ with Security to address vulnerabilities in the deployment stack and ensure secure\
  \ defaults and configurations.&lt;/li&gt; &lt;li value=&quot;7&quot;&gt;Build and\
  \ maintain automation and CI/CD pipelines that validate and test deployment tooling\
  \ across Omnibus, Charts, GET, and the Operator.&lt;/li&gt; &lt;li value=&quot;8&quot;&gt;Partner\
  \ with Distribution Engineers, SREs, Release Managers, and Development teams to\
  \ integrate new features into deployment methods and keep user-facing documentation\
  \ accurate and actionable.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What you\u2019ll bring&lt;/h2&gt;\
  \ &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Experience building and maintaining backend\
  \ services in production environments, ideally focused on deployment, infrastructure,\
  \ or platform tooling.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Practical experience\
  \ running workloads on Kubernetes, including authoring and maintaining Helm charts.&lt;/li&gt;\
  \ &lt;li value=&quot;3&quot;&gt;Proficiency with Ruby and Go, along with strong\
  \ scripting skills to automate workflows and tooling.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;Familiarity\
  \ with Terraform and infrastructure as code practices for managing cloud and on-premises\
  \ environments.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;Hands-on experience working\
  \ with relational databases, especially PostgreSQL, and understanding of performance\
  \ and reliability considerations.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;Understanding\
  \ of secure, scalable, and supportable deployment practices and common observability\
  \ tools such as Prometheus and Grafana.&lt;/li&gt; &lt;li value=&quot;7&quot;&gt;Experience\
  \ collaborating in large codebases and with distributed teams, including writing\
  \ clear, user-facing documentation and implementation guides.&lt;/li&gt; &lt;li\
  \ value=&quot;8&quot;&gt;Openness to learning, applying transferable skills, and\
  \ growing into new technologies and parts of the GitLab deployment stack.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;About the team&lt;/h2&gt; &lt;p&gt;The Operate team is part\
  \ of GitLab Delivery and is responsible for delivering GitLab to self-managed users\
  \ through supported and validated deployment tooling. We maintain and evolve the\
  \ GitLab Omnibus package, Helm Charts, GitLab Operator, and GitLab Environment Toolkit\
  \ (GET) to ensure GitLab is deployable, secure, and production-ready across diverse\
  \ environments. You\u2019ll work with a distributed group of backend engineers who\
  \ collaborate asynchronously across time zones and partner closely with Site Reliability\
  \ Engineering, Release, Security, and Development teams to keep deployments reliable\
  \ and aligned with new product capabilities. We are focused on improving installation\
  \ and upgrade experiences, strengthening security and automation, and enabling self-managed\
  \ customers to run GitLab with confidence at any scale.&lt;/p&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;h4&gt;&lt;strong&gt;How\
  \ GitLab will support you&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/&quot;&gt;Benefits\
  \ to support your health, finances, and well-being&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a\
  \ href=&quot;https://handbook.gitlab.com/handbook/people-group/paid-time-off/&quot;&gt;Flexible\
  \ Paid Time Off&lt;/a&gt;&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/company/culture/inclusion/erg-guide/#:~:text=Definition%20of%20the%20TMRG%20%2D%20Team%20Member%20Resource%20Groups,-TMRGs%20are%20voluntary&amp;amp;text=The%20purpose%20for%20this%20type,developing%20the%20sense%20of%20belonging.&quot;&gt;Team\
  \ Member Resource Groups&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/total-rewards/stock-options/&quot;&gt;Equity\
  \ Compensation &amp;amp; Employee Stock Purchase Plan&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a\
  \ href=&quot;https://handbook.gitlab.com/handbook/people-group/learning-and-development/growth-and-development/&quot;&gt;Growth\
  \ and Development Fund&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave&quot;&gt;Parental\
  \ leave&lt;/a&gt;&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/finance/expenses/#equipment&quot;&gt;Home\
  \ office&lt;/a&gt; support&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Please note that we welcome\
  \ interest from candidates with varying levels of experience; many successful candidates\
  \ do not meet every single requirement. Additionally, studies have shown that people\
  \ from &lt;a href=&quot;https://about.gitlab.com/company/culture/inclusion/#examples-of-select-underrepresented-groups&quot;&gt;underrepresented\
  \ groups&lt;/a&gt; are less likely to apply to a job unless they meet every single\
  \ qualification. If you&#39;re excited about this role, please apply and allow our\
  \ recruiters to assess your application.&lt;/p&gt; &lt;hr&gt; &lt;p&gt;&lt;strong&gt;Country\
  \ Hiring Guidelines: &lt;/strong&gt;GitLab hires new team members in countries around\
  \ the world. All of our roles are remote, however some roles may carry specific\
  \ location-based eligibility requirements. Our Talent Acquisition team can help\
  \ answer any questions about location after starting the recruiting process.&amp;nbsp;&amp;nbsp;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Privacy Policy: &lt;/strong&gt;Please review our &lt;a\
  \ href=&quot;https://handbook.gitlab.com/handbook/hiring/candidate-faq/recruitment-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;Recruitment Privacy Policy.&lt;/a&gt; Your privacy\
  \ is important to us.&lt;/p&gt; &lt;p&gt;GitLab is proud to be an equal opportunity\
  \ workplace and is an affirmative action employer. GitLab\u2019s policies and practices\
  \ relating to recruitment, employment, career development and advancement, promotion,\
