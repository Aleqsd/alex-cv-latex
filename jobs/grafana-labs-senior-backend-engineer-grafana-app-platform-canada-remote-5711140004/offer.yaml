    \ of our customers by participating in weekday 12h x 5d and a separate weekend\
    \ 24h x 2d on-call rotations.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;\
    \ &lt;p&gt;&lt;strong&gt;what makes you a great fit:&lt;/strong&gt;&lt;/p&gt;\
    \ &lt;ul&gt; &lt;li&gt;you have strong coding skills and operational experience;\
    \ you were responsible for operating the software you have built.&amp;nbsp;&lt;/li&gt;\
    \ &lt;li&gt;you have worked on a saas platform and dealt with common distributed\
    \ systems problems (e.g. scalability, multi-tenancy, data isolation, ha, \u2026\
    )&lt;/li&gt; &lt;li&gt;you have excellent communication skills. you can express\
    \ your ideas with great clarity in writing and during meetings. you know when\
    \ to pick which mode of communication.&lt;/li&gt; &lt;li&gt;you are willing to\
    \ work across teams. your work has to be aligned with the needs of other squads\
    \ and external stakeholders. you make your plans transparent, bring stakeholders\
    \ on board, and are open to feedback and suggestions.&lt;/li&gt; &lt;li&gt;you\
    \ are pragmatic; you prioritize progress over perfection; you can handle ambiguity.&lt;/li&gt;\
    \ &lt;li&gt;we are using golang on the backend; you are either already familiar\
    \ with golang or are excited to learn the language&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;\
    \ &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;h3&gt;compensation &amp;amp; rewards:&lt;/h3&gt;\
    \ &lt;p&gt;in canada, the base compensation range for this role is 164,000 cad\
    \ - 205.000 cad. actual compensation may vary based on level, experience, and\
    \ skillset as assessed throughout the interview process. all of our roles include\
    \ restricted stock units (rsus), giving every team member ownership in grafana\
    \ labs&#39; success. we believe in shared outcomes\u2014rsus help us stay aligned\
    \ and invested as we scale globally.&lt;/p&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;div&gt;\
    \ &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*compensation ranges\
    \ are country specific. if you are applying for this role from a different location\
    \ than listed above, your recruiter will discuss your specific market\u2019s defined\
    \ pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
    \ &lt;p&gt;&lt;strong&gt;why you\u2019ll thrive at grafana labs:&lt;/strong&gt;&lt;/p&gt;\
    \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100%\
    \ remote, global culture -&amp;nbsp;&lt;/strong&gt;as a remote-only company, we\
    \ bring together talent from around the world, united by a culture of collaboration\
    \ and shared purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;scaling organization&lt;/strong&gt;\
    \ \u2013 tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
    \ &lt;li&gt;&lt;strong&gt;transparent communication&lt;/strong&gt; \u2013 expect\
    \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;innovation-driven&lt;/strong&gt;\
    \ \u2013 autonomy and support to ship great work and try new things.&lt;/li&gt;\
    \ &lt;li&gt;&lt;strong&gt;open source roots&lt;/strong&gt; \u2013 built on community-driven\
    \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;empowered\
    \ teams&lt;/strong&gt; \u2013 high trust, low ego culture that values outcomes\
    \ over optics.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;career growth pathways&lt;/strong&gt;\
    \ \u2013 defined opportunities to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;approachable\
    \ leadership&lt;/strong&gt; \u2013 transparent execs who are involved, visible,\
    \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;passionate people&lt;/strong&gt;\
    \ \u2013 join a team of smart, supportive folks who care deeply about what they\
    \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;in-person onboarding &lt;/strong&gt;-\
    \ we want you to thrive from day 1 with your fellow new \u2018grafanistas\u2019\
    \ to learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;balance\
    \ is key&lt;/strong&gt; - we operate a global annual leave policy of 30 days per\
    \ annum. 3 days of your annual leave entitlement are reserved for grafana shutdown\
    \ days to allow the team to really disconnect. &lt;em&gt;*we will comply with\
    \ local legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;equal\
    \ opportunity employer:&lt;/strong&gt; we will recruit, train, compensate and\
    \ promote regardless of race, religion, color, national origin, gender, disability,\
    \ age, veteran status, and all the other fascinating characteristics that make\
    \ us different and unique. we believe that equality and diversity builds a strong\
    \ organization and we\u2019re working hard to make sure that\u2019s the foundation\
    \ of our organization as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;grafana\
    \ labs may utilize ai tools in its recruitment process to assist in matching information\
