    \ and communication: the smallest unit we have is a squad. you\u2019ll be working\
    \ with your teammates in a fully remote setup. good communication skills are a\
    \ must.&lt;/li&gt; &lt;/ul&gt; &lt;ul&gt; &lt;li&gt;solid experience with at least\
    \ one programming language. we use go, but if you have familiarity with python,\
    \ c, c++, rust or similar then that translates well&lt;/li&gt; &lt;li&gt;some\
    \ experience with delivering projects from gathering requirements, brainstorming\
    \ ideas all the way to shipping a product to the customer\u2019s hands in a self-driven\
    \ way&lt;/li&gt; &lt;li&gt;some experience with developing software that runs\
    \ in the cloud &lt;em&gt;or&lt;/em&gt; some experience with systems engineering&lt;/li&gt;\
    \ &lt;li&gt;some experience with being on-call and following the devops model&lt;/li&gt;\
    \ &lt;li&gt;experience writing clean, robust, and performant software that is\
    \ easily maintained by others&lt;/li&gt; &lt;li&gt;familiarity with observability\
    \ systems, know when to use metrics, logs, traces, to debug a problem.&lt;/li&gt;\
    \ &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;bonus points for:&lt;/strong&gt;&lt;/p&gt;\
    \ &lt;ul&gt; &lt;li&gt;experience working with kubernetes&lt;/li&gt; &lt;li&gt;experience\
    \ working with queue systems, e.g. the kafka protocol&lt;/li&gt; &lt;li&gt;been\
    \ a user of grafana and prometheus in operational roles (including on-call for\
    \ your team at a previous employer or just using these tools on hobby/homelab\
    \ projects)&lt;/li&gt; &lt;li&gt;exposure to microservices architecture and distributed\
    \ systems, or a desire to learn&lt;/li&gt; &lt;li&gt;familiarity with the concept\
    \ of infrastructure as code&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;in spain, the compensation\
    \ range for this role is eur 82,988 - eur 99,586. actual compensation may vary\
    \ based on level, experience, and skillset as assessed throughout the interview\
    \ process. all of our roles include restricted stock units (rsus), giving every\
    \ team member ownership in grafana labs&#39; success. we believe in shared outcomes\u2014\
    rsus help us stay aligned and invested as we scale globally.&lt;/p&gt;&lt;div\
    \ class=&quot;content-conclusion&quot;&gt;&lt;div&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*compensation\
    \ ranges are country specific. if you are applying for this role from a different\
    \ location than listed above, your recruiter will discuss your specific market\u2019\
    s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
    \ &lt;p&gt;&lt;strong&gt;why you\u2019ll thrive at grafana labs:&lt;/strong&gt;&lt;/p&gt;\
    \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100%\
    \ remote, global culture -&amp;nbsp;&lt;/strong&gt;as a remote-only company, we\
