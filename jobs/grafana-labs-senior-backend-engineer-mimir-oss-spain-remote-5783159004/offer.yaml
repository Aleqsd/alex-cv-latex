  raw: "remote spain (remote) senior backend engineer | mimir oss | spain | remote\
    \ &lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;grafana labs is a remote-first,\
    \ open-source powerhouse. there are more than 20m users of grafana, the open source\
    \ visualization tool, around the globe, monitoring everything from beehives to\
    \ climate change in the alps. the instantly recognizable dashboards have been\
    \ spotted everywhere from a nasa launch and minecraft hq to wimbledon and the\
    \ tour de france. grafana labs also helps more than 3,000 companies -- including\
    \ bloomberg, jpmorgan chase, and ebay -- manage their observability strategies\
    \ with the grafana lgtm stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;grafana\
    \ cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;grafana\
    \ enterprise stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;grafana\
    \ mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;grafana\
    \ loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;grafana\
    \ tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;we\u2019re scaling fast and staying true\
    \ to what makes us different: an open-source legacy, a global collaborative culture,\
    \ and a passion for meaningful work. our team thrives in an innovation-driven\
    \ environment where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt;\
    \ &lt;p&gt;you may not meet every requirement, and that\u2019s okay. if this role\
    \ excites you, we\u2019d love you to raise your hand for what could be a truly\
    \ career-defining opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;this\
    \ is a remote opportunity and we would be interested in applicants based in spain,\
    \ germany, the uk or sweden at this time.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;the\
    \ opportunity:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;as a mimir engineer you\u2019\
    ll join one of these two sub-squads: query or storage. together, they maintain\
    \ the open source &lt;a href=&quot;https://github.com/grafana/mimir&quot;&gt;grafana\
    \ mimir oss project&lt;/a&gt; and operate grafana cloud metrics across three major\
    \ cloud providers. this role offers the opportunity to work on large-scale, high-performance\
    \ distributed systems where efficiency, resilience, and reliability are essential\
    \ to keeping our metrics offerings competitive and smooth at massive volumes.&lt;/p&gt;\
    \ &lt;p&gt;mimir engineers work across a variety of streams. you\u2019ll typically\
    \ collaborate with another engineer on a larger project while also driving performance\
    \ and reliability improvements identified from operating the system in production.\
    \ in this role, you\u2019ll write and review prs and design documents, help guide\
    \ automated release rollouts, and participate in the on-call rotation for the\
    \ systems you own. this is a chance to directly shape, optimize, and scale one\
    \ of the industry\u2019s most advanced metrics platforms.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;what\
    \ you\u2019ll be doing:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;take an\
    \ active role in influencing our roadmap and your own career objectives&amp;nbsp;&lt;/li&gt;\
    \ &lt;li&gt;work with your team to deliver new features solving customer problems\
    \ and enhancing operations on a large database at scale&lt;/li&gt; &lt;li&gt;drive\
    \ projects from initial idea all the way to operations once it is in the hands\
    \ of customers&lt;/li&gt; &lt;li&gt;embrace our open-source culture and contribute\
    \ to other projects that may not directly fall within your team\u2019s scope&lt;/li&gt;\
    \ &lt;li&gt;design, build, operate, and maintain critical systems, owning the\
    \ reliability, performance, and availability&lt;/li&gt; &lt;li&gt;be a part of\
    \ your team\u2019s follow-the-sun on-call rotations and take ownership of the\
    \ services you\u2019re running&lt;/li&gt; &lt;li&gt;support other team members,\
    \ participate in design discussions and collaborate with the team&lt;/li&gt; &lt;li&gt;learn\
    \ new skills by gaining a deeper understanding of our cloud product and our customers\
    \ and getting to know the codebase of a large distributed system&lt;/li&gt; &lt;/ul&gt;\
    \ &lt;p&gt;we invest heavily in developer productivity. you can use modern ai\
    \ coding assistants as part of your daily workflow (your choice of tools, within\
    \ security guidelines), backed by a company-funded usage budget so you can iterate\
    \ quickly without unnecessary friction.&lt;br&gt;we encourage pragmatic ai-assisted\
    \ development: faster prototyping, test generation, refactors, documentation,\
    \ and incident follow-ups\u2014always paired with strong code review and quality\
    \ standards.&lt;br&gt;you\u2019ll also have access to frontier models (e.g., gpt-codex\
    \ 5/3, claude opus 4.6, gemini 3 pro).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;what makes\
    \ you a great fit:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;pragmatism: you\
    \ are able to take on complex challenges and break them down to achieve short\
    \ feedback loops: to analyze, design, and build modular solutions, deliver mvps,\
