  raw: "remote canada (remote) software engineer - platform infracore | usa | remote\
    \ &lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;grafana labs is a remote-first,\
    \ open-source powerhouse. there are more than 20m users of grafana, the open source\
    \ visualization tool, around the globe, monitoring everything from beehives to\
    \ climate change in the alps. the instantly recognizable dashboards have been\
    \ spotted everywhere from a nasa launch and minecraft hq to wimbledon and the\
    \ tour de france. grafana labs also helps more than 3,000 companies -- including\
    \ bloomberg, jpmorgan chase, and ebay -- manage their observability strategies\
    \ with the grafana lgtm stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;grafana\
    \ cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;grafana\
    \ enterprise stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;grafana\
    \ mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;grafana\
    \ loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;grafana\
    \ tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;we\u2019re scaling fast and staying true\
    \ to what makes us different: an open-source legacy, a global collaborative culture,\
    \ and a passion for meaningful work. our team thrives in an innovation-driven\
    \ environment where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt;\
    \ &lt;p&gt;you may not meet every requirement, and that\u2019s okay. if this role\
    \ excites you, we\u2019d love you to raise your hand for what could be a truly\
    \ career-defining opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;this\
    \ is a remote opportunity, and we would be interested in applicants from canadian\
    \ time zones only at this time.&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;h2&gt;senior\
    \ software engineer - platform infracore&lt;/h2&gt; &lt;h4&gt;&lt;strong&gt;the\
    \ opportunity:&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;&lt;strong&gt;about\
    \ our platform:&lt;/strong&gt;&lt;br&gt;grafana cloud moves millions of metrics,\
    \ log lines, and traces per second from our customers&#39; environments into a\
    \ highly available, low-latency stack that processes and stores this data, and\
    \ serves them to dashboards and alerting tools. we aim to grow this to hundreds\
    \ of millions per second, and it&#39;s critical that as we grow, we improve our\
    \ performance, increase our reliability, and, of course, do it efficiently and\
    \ effectively.&lt;/p&gt; &lt;p&gt;the internal engineering platform (iep) delivered\
    \ by the platform group provides application engineers with the tools, systems\
    \ and kubernetes clusters they need to build, deploy and run their workloads.\
    \ platform roles at grafana labs have an eye for engineers with a passion for\
    \ performance and reliability, and who enjoy taking projects from conception to\
    \ production. we organize ourselves into squads to allow focus on: cloud infrastructure\
    \ and capacity management; security; engineering productivity; monitoring and\
    \ sustainability; and us federal compliance.&lt;/p&gt; &lt;p&gt;because we deploy\
    \ production services, we have on-call rotations to ensure the health of the system.\
    \ everyone at grafana labs tries to incorporate and use our product line up into\
    \ their day-to-day, so being on call is an important way to understand our system\
    \ and how people use our products.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;what you\u2019\
    ll be doing:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;we are hiring for the platform\
    \ infracore squad. this squad provides and owns automation of the provisioning\
    \ of csp resources, including networking, kubernetes clusters and specific csp\
    \ resources required by our application teams.&amp;nbsp;&lt;/p&gt; &lt;p&gt;we\u2019\
    re part of a platform engineering group that manages infrastructure for the teams\
    \ that are building some of the most cherished platform tools - grafana, mimir,\
    \ loki, tempo, pyroscope to name a few.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;what\
    \ makes you a great fit:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;you enjoy\
    \ working with engineers, as well as with the management structures that are there\
    \ to support you and enable you and your team to do your very best.&amp;nbsp;&lt;/li&gt;\
