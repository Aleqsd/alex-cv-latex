job_description_raw: "&lt;p&gt;Work across the full Linux stack from kernel through\
  \ GUI to optimise Ubuntu, the world\u2019s most widely used Linux desktop and server,\
  \ for the latest silicon.&lt;/p&gt; &lt;p&gt;The role is a fast-paced, problem-solving\
  \ role that\u2019s challenging yet very exciting. The right candidate must be resourceful,\
  \ articulate, and able to deliver on a wide variety of solutions across PC and IoT\
  \ technologies. Our teams partner with specialist engineers from major silicon companies\
  \ to integrate next-generation features and performance enhancements for upcoming\
  \ hardware.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Location:&lt;/strong&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt; &lt;/span&gt;&lt;em&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;This\
  \ is a Globally remote role&lt;/span&gt;&lt;/em&gt;&lt;/p&gt; &lt;h2&gt;&lt;span\
  \ style=&quot;font-weight: 400;&quot;&gt;What your day will look like&lt;/span&gt;&lt;/h2&gt;\
  \ &lt;ul&gt; &lt;li&gt;Design and implement the best Ubuntu integration for the\
  \ latest IoT and server-class hardware platforms and software stacks&lt;/li&gt;\
  \ &lt;li&gt;Work with partners to deliver a delightful, optimised, first class Ubuntu\
  \ experience on their platforms&lt;/li&gt; &lt;li&gt;Take a holistic approach to\
  \ the Ubuntu experience on partner platforms with inputs on technical plans, testing\
  \ strategy, quality metrics&lt;/li&gt; &lt;li&gt;Participate as technical lead on\
  \ complex customer engagements involving complete system architectures from cloud\
  \ to edge&lt;/li&gt; &lt;li&gt;Help our customers integrate their apps, SDKs, build\
  \ device OS images, optimize applications with Ubuntu Core, Desktop and Server&lt;/li&gt;\
  \ &lt;li&gt;Work with the most advanced operating systems and application technologies\
  \ available in the enterprise world.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Joining Canonical,\
  \ you will partner with bright minds from all over the world, and work with an exciting\
  \ set of new technologies in a fast growing company with a truly unique and ambitious\
  \ vision to build a better platform with free software. You will work with customers\
  \ on exciting IoT and server platforms and technologies, built to support different\
  \ verticals: from robots to data centers, from telco to retail.&lt;/p&gt; &lt;h2&gt;&lt;span\
  \ style=&quot;font-weight: 400;&quot;&gt;What we are looking for in you&lt;/span&gt;&lt;/h2&gt;\
  \ &lt;ul&gt; &lt;li&gt;You love technology and working with brilliant people&lt;/li&gt;\
  \ &lt;li&gt;You have a Bachelor\u2019s degree in Computer Science, STEM or similar&amp;nbsp;&lt;/li&gt;\
  \ &lt;li&gt;You have experience with Linux packaging (Debian, RPM, Yocto)&lt;/li&gt;\
  \ &lt;li&gt;You have experience working with open source communities and licences&lt;/li&gt;\
  \ &lt;li&gt;You have experience working with C, C++&lt;/li&gt; &lt;li&gt;You can\
  \ work in a globally distributed team through self-discipline and self-motivation.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Additional\
  \ skills that you might also bring&lt;/span&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Experience\
  \ with graphics stacks&lt;/li&gt; &lt;li&gt;Good understanding of networking - TCP/IP,\
  \ DHCP, HTTP/REST&lt;/li&gt; &lt;li&gt;Basic understanding of security best practices\
  \ in IoT or server environments&lt;/li&gt; &lt;li&gt;Good communication skills,\
  \ ideally public speaking experience&lt;/li&gt; &lt;li&gt;IoT / Embedded experience\
  \ \u2013 from board and SoC, BMCs, bootloaders and firmware to OS, through apps\
  \ and services&lt;/li&gt; &lt;li&gt;Some experience with Docker/OCI containers/K8s&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;What we\
  \ offer you&lt;/span&gt;&lt;/h2&gt; &lt;p&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Your\
  \ base pay will depend on various factors including your geographical location,\
  \ level of experience, knowledge and skills. In addition to the benefits above,\
  \ certain roles are also eligible for additional benefits and rewards including\
  \ annual bonuses and sales incentives based on revenue or utilisation. Our compensation\
  \ philosophy is to ensure equity right across our global workforce.&amp;nbsp;&amp;nbsp;&lt;/span&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;In addition to a competitive\
  \ base pay, we provide all team members with additional benefits, which reflect\
  \ our values and ideals. Please note that additional benefits may apply depending\
  \ on the work location and, for more information on these, you can ask in the later\
  \ stages of the recruitment process.&lt;/span&gt;&lt;/p&gt; &lt;ul&gt; &lt;li style=&quot;font-weight:\
  \ 400;&quot;&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Fully remote working\
  \ environment - we\u2019ve been working remotely since 2004!&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: 400;&quot;&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;Personal learning and development budget of 2,000USD per annum&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: 400;&quot;&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;Annual compensation review&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-weight:\
  \ 400;&quot;&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Recognition rewards&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: 400;&quot;&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;Annual holiday leave&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-weight:\
  \ 400;&quot;&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Parental Leave&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: 400;&quot;&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;Employee Assistance Programme&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-weight:\
  \ 400;&quot;&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Opportunity to travel\
  \ to new locations to meet colleagues at \u2018sprints\u2019&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: 400;&quot;&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;Priority Pass for travel and travel upgrades for long haul company\
  \ events&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;About Canonical&lt;/span&gt;&lt;/h2&gt; &lt;p&gt;&lt;span style=&quot;font-weight:\
  \ 400;&quot;&gt;Canonical is a pioneering tech firm that is at the forefront of\
  \ the global move to open source. As the company that publishes Ubuntu, one of the\
  \ most important open source projects and the platform for AI, IoT and the cloud,\
  \ we are changing the world on a daily basis. We recruit on a global basis and set\
  \ a very high standard for people joining the company. We expect excellence - in\
  \ order to succeed, we need to be the best at what we do.&lt;/span&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;Canonical has been a\
  \ remote-first company since its inception in 2004.\u200B Work at Canonical is a\
  \ step into the future, and will challenge you to think differently, work smarter,\
  \ learn new skills, and raise your game. Canonical provides a unique window into\
  \ the world of 21st-century digital business.&lt;/span&gt;&lt;/p&gt; &lt;h2&gt;&lt;span\
  \ style=&quot;font-weight: 400;&quot;&gt;Canonical is an equal opportunity employer&lt;/span&gt;&lt;/h2&gt;\
  \ &lt;p&gt;&lt;span style=&quot;font-weight: 400;&quot;&gt;We are proud to foster\
  \ a workplace free from discrimination. Diversity of experience, perspectives, and\
  \ background create a better work environment and better products. &lt;/span&gt;&lt;a\
  \ href=&quot;https://canonical.com/careers/diversity/identity&quot;&gt;&lt;span\
  \ style=&quot;font-weight: 400;&quot;&gt;Whatever your identity, we will give your\
  \ application fair consideration.&lt;/span&gt;&lt;/a&gt;&lt;/p&gt; &lt;p&gt;&lt;span\
  \ style=&quot;font-weight: 400;&quot;&gt;#LI-remote&amp;nbsp;&lt;/span&gt;&lt;/p&gt;"
