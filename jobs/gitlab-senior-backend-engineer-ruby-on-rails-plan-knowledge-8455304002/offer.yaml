    \ member resource groups&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/total-rewards/stock-options/&quot;&gt;equity\
    \ compensation &amp;amp; employee stock purchase plan&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a\
    \ href=&quot;https://handbook.gitlab.com/handbook/people-group/learning-and-development/growth-and-development/&quot;&gt;growth\
    \ and development fund&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave&quot;&gt;parental\
    \ leave&lt;/a&gt;&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/finance/expenses/#equipment&quot;&gt;home\
    \ office&lt;/a&gt; support&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;please note that we\
    \ welcome interest from candidates with varying levels of experience; many successful\
    \ candidates do not meet every single requirement. additionally, studies have\
    \ shown that people from &lt;a href=&quot;https://about.gitlab.com/company/culture/inclusion/#examples-of-select-underrepresented-groups&quot;&gt;underrepresented\
    \ groups&lt;/a&gt; are less likely to apply to a job unless they meet every single\
    \ qualification. if you&#39;re excited about this role, please apply and allow\
    \ our recruiters to assess your application.&lt;/p&gt; &lt;hr&gt; &lt;p&gt;&lt;strong&gt;country\
    \ hiring guidelines: &lt;/strong&gt;gitlab hires new team members in countries\
    \ around the world. all of our roles are remote, however some roles may carry\
    \ specific location-based eligibility requirements. our talent acquisition team\
    \ can help answer any questions about location after starting the recruiting process.&amp;nbsp;&amp;nbsp;&lt;/p&gt;\
    \ &lt;p&gt;&lt;strong&gt;privacy policy: &lt;/strong&gt;please review our &lt;a\
    \ href=&quot;https://handbook.gitlab.com/handbook/hiring/candidate-faq/recruitment-privacy-policy/&quot;\
    \ target=&quot;_blank&quot;&gt;recruitment privacy policy.&lt;/a&gt; your privacy\
    \ is important to us.&lt;/p&gt; &lt;p&gt;gitlab is proud to be an equal opportunity\
    \ workplace and is an affirmative action employer. gitlab\u2019s policies and\
    \ practices relating to recruitment, employment, career development and advancement,\
    \ promotion, and retirement are based solely on merit, regardless of race, color,\
    \ religion, ancestry, sex (including pregnancy, lactation, sexual orientation,\
    \ gender identity, or gender expression), national origin, age, citizenship, marital\
    \ status, mental or physical disability, genetic information (including family\
    \ medical history), discharge status from the military, protected veteran status\
    \ (which includes disabled veterans, recently separated veterans, active duty\
    \ wartime or campaign badge veterans, and armed forces service medal veterans),\
    \ or any other basis protected by law. gitlab will not tolerate discrimination\
    \ or harassment based on any of these characteristics. see also&amp;nbsp;&lt;a\
    \ href=&quot;https://about.gitlab.com/handbook/people-policies/inc-usa/#equal-employment-opportunity-policy&quot;\
    \ target=&quot;_blank&quot;&gt;gitlab\u2019s eeo policy&lt;/a&gt;&amp;nbsp;and&amp;nbsp;&lt;a\
    \ href=&quot;https://about.gitlab.com/handbook/labor-and-employment-notices/#eeoc-us-equal-employment-opportunity-commission-notices&quot;\
    \ target=&quot;_blank&quot;&gt;eeo is the law&lt;/a&gt;. if you have a disability\
    \ or special need that requires&amp;nbsp;&lt;a href=&quot;https://about.gitlab.com/handbook/people-policies/inc-usa/#reasonable-accommodation&quot;\
    \ target=&quot;_blank&quot;&gt;accommodation&lt;/a&gt;, please let us know during\
    \ the&amp;nbsp;&lt;a href=&quot;https://about.gitlab.com/handbook/hiring/interviewing/#adjustments-to-our-interview-process&quot;\
    \ target=&quot;_blank&quot;&gt;recruiting process&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;"
