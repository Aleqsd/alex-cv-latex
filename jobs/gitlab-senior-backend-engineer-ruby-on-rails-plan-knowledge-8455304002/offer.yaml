job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;GitLab is\
  \ the intelligent orchestration platform for DevSecOps. GitLab enables organizations\
  \ to increase developer productivity, improve operational efficiency, reduce security\
  \ and compliance risk, and accelerate digital transformation. More than 50 million\
  \ registered users and more than 50% of the Fortune 100* trust GitLab to ship better,\
  \ more secure software faster.&lt;/p&gt; &lt;p&gt;The same principles built into\
  \ our products are reflected in how our team works: we embrace AI as a core productivity\
  \ multiplier, with all team members expected to incorporate AI into their daily\
  \ workflows to drive efficiency, innovation, and impact. GitLab is where careers\
  \ accelerate, innovation flourishes, and every voice is valued. Our high-performance\
  \ culture is driven by our &lt;a href=&quot;https://handbook.gitlab.com/handbook/values/&quot;&gt;values&lt;/a&gt;\
  \ and continuous knowledge exchange, enabling our team members to reach their full\
  \ potential while collaborating with industry leaders to solve complex problems.\
  \ &lt;a href=&quot;https://www.youtube.com/watch?v=OuZIb5zszQI&quot;&gt;Co-create\
  \ the future with us&lt;/a&gt; as we build technology that transforms how the world\
  \ develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;Fortune 500\xAE is a registered\
  \ trademark of Fortune Media IP Limited, used under license. Claim based on GitLab\
  \ data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500\
  \ list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated\
  \ with, and do not endorse products or services of GitLab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;&lt;strong&gt;An\
  \ overview of this role&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;As a Senior Backend Engineer\
  \ (Ruby on Rails) on the &lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/devops/dev/plan/knowledge/&quot;&gt;Plan:\
  \ Knowledge group&lt;/a&gt;, you&#39;ll help shape how teams plan, document, and\
  \ share knowledge in GitLab. You&#39;ll build and improve the backend systems behind\
  \ Wiki, Pages, Markdown, and text editors, while also helping design AI-powered\
  \ capabilities such as the &lt;a href=&quot;https://docs.gitlab.com/user/duo_agent_platform/agents/foundational_agents/planner/&quot;&gt;planner\
  \ agent &lt;/a&gt;and Model Context Protocol (MCP) integrations that connect GitLab&#39;s\
  \ GraphQL APIs with external tools. In this role, you&#39;ll work closely with frontend\
  \ engineers, Product, UX, and Security to create reliable, scalable systems that\
  \ support both technical and non-technical users across GitLab&#39;s planning experience.\
  \ As part of GitLab&#39;s AI-first culture, you&#39;ll also use the Duo Agent Platform\
  \ in your daily workflow to improve productivity and support faster iteration.&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Some examples of our projects:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Building&lt;/strong&gt; AI agents such as the\
  \ planner agent to support planning and knowledge management workflows&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Architecting&lt;/strong&gt; MCP integrations that expose\
  \ GitLab GraphQL APIs to external AI tools and platforms&lt;/li&gt; &lt;/ul&gt;\
  \ &lt;h2&gt;&lt;strong&gt;What you&#39;ll do&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt;\
  \ &lt;li&gt;&lt;strong&gt;Lead&lt;/strong&gt; backend architecture for Wiki, Pages,\
  \ Markdown, and text editor capabilities used across GitLab.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Design&lt;/strong&gt;\
  \ and build AI agents that support planning and knowledge management workflows.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Architect&lt;/strong&gt; MCP integrations that connect\
  \ GitLab GraphQL APIs with external AI platforms and tools.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Drive&lt;/strong&gt;\
  \ improvements in reliability and performance across application code, PostgreSQL\
  \ queries, Redis usage, and background jobs.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Develop&lt;/strong&gt;\
  \ and evolve GraphQL APIs that are clear for frontend engineers and support scalable\
  \ product experiences.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Collaborate&lt;/strong&gt;\
  \ with frontend engineers, Product, UX, and Security to break down complex work\
  \ into shippable iterations.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Mentor&lt;/strong&gt;\
  \ engineers through code review, technical discussions, and shared backend best\
  \ practices.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Support&lt;/strong&gt; incident\
  \ response and production debugging, then turn learnings into lasting system improvements.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;What you&#39;ll bring&lt;/strong&gt;&lt;/h2&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Strong experience&lt;/strong&gt; building and\
  \ maintaining backend applications with &lt;strong&gt;Ruby on Rails&lt;/strong&gt;,\
  \ including core components such as ActiveRecord and Redis.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Experience&lt;/strong&gt;\
  \ designing and supporting &lt;strong&gt;GraphQL&lt;/strong&gt; APIs with attention\
  \ to usability, maintainability, and performance.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Knowledge&lt;/strong&gt;\
  \ of &lt;strong&gt;PostgreSQL&lt;/strong&gt; query design, optimization, and scaling\
  \ in high-traffic production systems.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Experience&lt;/strong&gt;\
  \ building or integrating &lt;strong&gt;AI agents&lt;/strong&gt;, intelligent workflows,\
  \ or related platform capabilities.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Familiarity&lt;/strong&gt;\
  \ with &lt;strong&gt;Model Context Protocol (MCP)&lt;/strong&gt; or similar patterns\
  \ for connecting APIs to external tools and platforms.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Ability&lt;/strong&gt;\
  \ to investigate production issues, debug complex systems, and improve reliability\
  \ over time.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Experience&lt;/strong&gt; leading\
  \ technical decisions, mentoring engineers, and contributing to engineering standards\
  \ across a team.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Clear communication&lt;/strong&gt;\
  \ and cross-functional collaboration skills, with openness to candidates who bring\
  \ transferable experience from adjacent backend or platform work.&lt;/li&gt; &lt;/ul&gt;\
  \ &lt;h2&gt;&lt;strong&gt;About the team&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;The\
  \ Plan: Knowledge group owns core knowledge management experiences in GitLab, including&lt;a\
  \ href=&quot;https://docs.gitlab.com/user/project/wiki/&quot;&gt; Wiki&lt;/a&gt;,&lt;a\
  \ href=&quot;https://docs.gitlab.com/user/project/pages/&quot;&gt; Pages&lt;/a&gt;,&lt;a\
  \ href=&quot;https://docs.gitlab.com/user/markdown/&quot;&gt; Markdown&lt;/a&gt;,\
  \ and&lt;a href=&quot;https://docs.gitlab.com/user/rich_text_editor/&quot;&gt; Text\
  \ Editors&lt;/a&gt;, and is expanding those foundations with AI-powered capabilities\
  \ such as the&lt;a href=&quot;https://docs.gitlab.com/user/duo_agent_platform/agents/foundational_agents/planner/&quot;&gt;\
  \ planner agent&lt;/a&gt; and MCP-based integrations. The team includes 6 engineers\
  \ and works with a Product Manager, Engineering Manager, Product Designer, and Technical\
  \ Writer. Like many teams at GitLab, they collaborate asynchronously across regions\
  \ and work closely with the broader&lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/devops/dev/plan/&quot;&gt;\
  \ Plan stage&lt;/a&gt; to solve backend scale, editing experience, and AI integration\
  \ challenges in one shared platform. For more on the team&#39;s direction, see the&lt;a\
  \ href=&quot;https://about.gitlab.com/direction/plan/&quot;&gt; Plan: Knowledge\
  \ Direction Page&lt;/a&gt;.&lt;/p&gt; &lt;p&gt;&lt;br&gt;&lt;br&gt;&lt;/p&gt;&lt;div\
