job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;This is a remote opportunity\
  \ and we would be interested in applicants based in Spain, Germany, the UK or Sweden\
  \ at this time.&lt;/strong&gt;&lt;/p&gt; &lt;h2&gt;Staff Software Engineer - Grafana\
  \ Cloud Observability, Kubernetes Monitoring&lt;/h2&gt; &lt;h4&gt;&lt;strong&gt;The\
  \ Opportunity:&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;Grafana Cloud is our\
  \ composable observability platform that integrates metrics, logs, and traces with\
  \ Grafana. It allows our customers to leverage the best open source observability\
  \ software \u2013 including Prometheus, Mimir, Loki, and Tempo \u2013 without the\
  \ overhead of installing, maintaining and scaling their own observability stack&lt;/p&gt;\
  \ &lt;p&gt;The Observability department is focused on enabling developers to understand\
  \ the health and performance of their applications and infrastructure in any environment\
  \ by providing tools to instrument their code, ingest observability data into Grafana\
  \ Cloud and visualize and explore it.&lt;/p&gt; &lt;p&gt;In this role, you will\
  \ be part of the team that builds our Cloud Observability stack that allows customers\
  \ to collect and visualize metrics from various systems and applications. We build\
  \ and maintain the backend of opinionated applications such as Cloud Provider Observability,\
  \ Database Observability, and Kubernetes Monitoring. This includes the dashboards,\
  \ alerts, documentation, and infrastructure while working closely with other teams\
  \ to ensure seamless experiences. We also strive to incorporate OSS contributions\
  \ in our work by contributing to projects such as Alloy, Prometheus, OpenTelemetry,\
  \ and Beyla. The Observability department provides a core building block for customers\
  \ using Grafana Cloud.&lt;/p&gt; &lt;p&gt;As a company we are remote-first and global,\
  \ we embrace people of different experiences and backgrounds to build diverse teams\
  \ where every person brings a unique perspective to the software. We are looking\
  \ for Engineers that are passionate about communicating with data and providing\
  \ seamless experiences for our customers to join our growing team! Engineers at\
  \ Grafana also have the opportunity to contribute to Open Source communities.&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;What You\u2019ll Be Doing:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;At\
  \ Grafana Labs, our engineers have a dedicated career path and do not have to become\
  \ managers to progress in their career. Staff Software Engineers at Grafana have\
  \ a large amount of experience across multiple areas. They are able to estimate,\
  \ plan, coordinate and deliver large tasks spanning multiple systems. They actively\
  \ coach and mentor other team members in their team and are able to identify and\
  \ resolve issues with technology and product processes.&lt;/p&gt; &lt;p&gt;You will\
  \ bring your passion for observability and software engineering expertise to help\
  \ us take our infrastructure monitoring capabilities within Grafana Cloud to the\
  \ next level. This will include working with our Kubernetes monitoring solution.&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Design and implement high-quality, scalable integrations\
  \ for various infrastructure components, applications, and data ingestion pipelines&amp;nbsp;&lt;/li&gt;\
  \ &lt;li&gt;Create middleware components and libraries that simplify development\
  \ and maintenance of observability solutions&lt;/li&gt; &lt;li&gt;When necessary,\
  \ represent Grafana Labs in open source forums, working groups, and events&lt;/li&gt;\
  \ &lt;li&gt;Work with product teams, in addition to design and docs, to develop\
  \ features that align with wider product strategy and customer needs&lt;/li&gt;\
  \ &lt;li&gt;Lead the technical direction and vision of the team, contributing to\
  \ strategic discussions and future development of observability solutions&lt;/li&gt;\
  \ &lt;li&gt;Work with other departments including Sales, Product, and Support teams\
  \ to deliver a holistic product experience&lt;/li&gt; &lt;li&gt;Take ownership of\
  \ the services you\u2019re running by deploying well tested clean code&lt;/li&gt;\
  \ &lt;li&gt;Embrace our open-source culture and contribute to other projects that\
  \ may not directly fall within your team\u2019s scope&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;As\
  \ we are remote-first and our engineering organization is entirely remote, we provide\
  \ guidance and meet regularly using video calls, so an independent attitude, good\
  \ communication skills, and transparency are a must.&lt;/p&gt; &lt;p&gt;We invest\
  \ heavily in developer productivity. You can use modern AI coding assistants as\
  \ part of your daily workflow (your choice of tools, within security guidelines),\
  \ backed by a company-funded usage budget so you can iterate quickly without unnecessary\
  \ friction.&amp;nbsp;We encourage pragmatic AI-assisted development: faster prototyping,\
  \ test generation, refactors, documentation, and incident follow-ups\u2014always\
  \ paired with strong code review and quality standards.&amp;nbsp;You\u2019ll also\
  \ have access to frontier models (e.g., GPT-Codex 5/3, Claude Opus 4.6, Gemini 3\
  \ Pro).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What Makes You a Great Fit:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;You have a passion for observability and like to share your\
  \ knowledge by writing documentation and blog posts.&lt;/li&gt; &lt;li&gt;You love\
  \ to engage with customers and help them out.&lt;/li&gt; &lt;li&gt;You have excellent\
  \ communication skills.&lt;/li&gt; &lt;li&gt;You have relevant open source experience,\
  \ ideally in the observability domain.&lt;/li&gt; &lt;li&gt;You are willing to become\
  \ an active member of the OpenTelemetry and Prometheus communities.&lt;/li&gt; &lt;li&gt;You\u2019\
  re curious and you enjoy learning new programming languages and frameworks, setting\
  \ up examples, and figuring out how things work.&lt;/li&gt; &lt;li&gt;You have a\
  \ good understanding of typical production environments. Ideally you have been responsible\
  \ for operating production services and organizing on-call.&lt;/li&gt; &lt;li&gt;You\
  \ actively mentor other team members, identifying areas for focus and improvement.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;\
  \ &lt;li&gt;Strong 8+ years of experience with at least one programming language\
  \ - any major language (Python, .NET, Java, Go, Rust, etc) is acceptable&lt;/li&gt;\
  \ &lt;li&gt;Demonstrated working experience in operating high-scale production systems\
  \ running on Kubernetes and monitoring it, including on-call participation, incident\
  \ response, and postmortem practices&lt;/li&gt; &lt;li&gt;Familiarity with observability\
  \ tooling (e.g. Grafana)&lt;/li&gt; &lt;li&gt;Strong understanding of time-series\
  \ data, metrics cardinality challenges, and cost/performance tradeoffs/optimizations\
  \ in observability systems&lt;/li&gt; &lt;li&gt;Experience in a hands-on technical\
  \ leadership role - setting technical direction, leading project teams, and influencing\
  \ architectural decisions beyond your immediate team&lt;/li&gt; &lt;li&gt;Deep understanding\
  \ of distributed systems concepts including scalability, consistency, high availability,\
  \ and failure modes in large-scale systems&lt;/li&gt; &lt;li&gt;Experience writing\
  \ clean, maintainable, robust, and performant software&lt;/li&gt; &lt;li&gt;Experience\
  \ with delivering projects from start to finish in a self-driven manner&lt;/li&gt;\
  \ &lt;li&gt;Excellent problem-solving and debugging skills&lt;/li&gt; &lt;li&gt;Strong\
  \ mentoring and leadership skills&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus\
  \ Points For:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Experience operating\
  \ or scaling Prometheus in high-cardinality, multi-tenant environments&lt;/li&gt;\
  \ &lt;li&gt;Experience working with OpenTelemetry Collector pipelines or similar\
  \ telemetry ingestion systems&lt;/li&gt; &lt;li&gt;Certified Kubernetes Administrator\
  \ (CKA)/ Certified Kubernetes Application Developer (CKAD) or any other Kubernetes\
  \ related certification from CNCF&lt;/li&gt; &lt;li&gt;Experience developing Kubernetes\
  \ operators, controllers, or custom resources&lt;/li&gt; &lt;li&gt;Strong understanding\
  \ of metrics collection, visualization, and alerting concepts&lt;/li&gt; &lt;li&gt;Experience\
  \ contributing to or maintaining open source projects, with evidence of successful\
  \ pull requests and community collaboration&lt;/li&gt; &lt;li&gt;Experience designing\
  \ and building observability backends for various systems and applications&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Compensation &amp;amp; Rewards:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;In United Kingdom, the compensation range for this role is GBP &lt;span\
  \ data-sheets-root=&quot;1&quot;&gt;103,958&lt;/span&gt; - GBP &lt;span data-sheets-root=&quot;1&quot;&gt;124,750&lt;/span&gt;.\
  \ Actual compensation may vary based on level, experience, and skillset as assessed\
  \ throughout the interview process. All of our roles include Restricted Stock Units\
  \ (RSUs), giving every team member ownership in Grafana Labs&#39; success. We believe\
  \ in shared outcomes\u2014RSUs help us stay aligned and invested as we scale globally.&lt;/p&gt;&lt;div\
  \ class=&quot;content-conclusion&quot;&gt;&lt;div&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation\
  \ ranges are country specific. If you are applying for this role from a different\
  \ location than listed above, your recruiter will discuss your specific market\u2019\
  s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
