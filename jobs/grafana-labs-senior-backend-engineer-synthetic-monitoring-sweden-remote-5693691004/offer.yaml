job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;This\
  \ is a remote opportunity and we would be interested in applicants in Sweden.&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;h2&gt;&lt;strong&gt;Senior Backend Engineer - Synthetic Monitoring&lt;/strong&gt;&lt;/h2&gt;\
  \ &lt;h4&gt;&lt;strong&gt;The Opportunity:&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;We\
  \ are the team behind &lt;a href=&quot;https://grafana.com/oss/k6/&quot;&gt;Grafana\
  \ k6&lt;/a&gt;, &lt;a href=&quot;https://grafana.com/products/cloud/k6/&quot;&gt;Grafana\
  \ Cloud k6&lt;/a&gt;, and &lt;a href=&quot;https://grafana.com/products/cloud/synthetic-monitoring/&quot;&gt;Grafana\
  \ Cloud Synthetics&lt;/a&gt;, used by teams globally to ensure resilient, high-performing\
  \ systems.&amp;nbsp; This opportunity is with the synthetics squad, who build and\
  \ operate our monitoring product:&amp;nbsp; a multi-tenant distributed system implemented\
  \ in Go and running on Kubernetes across all major Cloud service providers (GCP,\
  \ Azure, AWS), running billions of synthetic tests each month.&lt;/p&gt; &lt;p&gt;Senior\
  \ Software Engineers at Grafana have a large amount of experience across multiple\
  \ areas. They are able to estimate, plan, coordinate and deliver large tasks spanning\
  \ multiple systems. They actively coach and mentor other team members in their team\
  \ and are able to identify and resolve issues with technology and product processes.&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;What You\u2019ll Be Doing:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;We\
  \ define senior roles via the scope of their business impact more than via their\
  \ expertise or their specific activities. The most important thing we are looking\
  \ for in an engineer is the ability to take ownership. You will need to drive technical\
  \ implementations working across engineering teams and departments, contribute to\
  \ business conversations, and help shape the long-term strategy. You\u2019ll bring\
  \ your passion for observability and software engineering expertise to help us take\
  \ synthetic monitoring capabilities within Grafana Cloud to the next level. This\
  \ will include working across products including Synthetics, Frontend Observability,\
  \ Grafana k6, and Grafana Cloud k6.&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Design and implement\
  \ high-quality, scalable services to be consumed by multiple Grafana Cloud products.&amp;nbsp;&lt;/li&gt;\
  \ &lt;li&gt;Work with product teams, in addition to design and docs, to develop\
  \ features that align with wider product strategy and customer needs&lt;/li&gt;\
  \ &lt;li&gt;Support the technical direction and vision of the team, contributing\
  \ to strategic discussions and future development of observability solutions&lt;/li&gt;\
  \ &lt;li&gt;When necessary, represent Grafana Labs in open source forums, working\
  \ groups, and events&lt;/li&gt; &lt;li&gt;Work with other departments including\
  \ Sales, Product, and Support teams to deliver a holistic product experience&lt;/li&gt;\
  \ &lt;li&gt;Be a part of your team\u2019s follow-the-sun on-call rotations and take\
  \ ownership of the services you\u2019re running&lt;/li&gt; &lt;li&gt;Embrace our\
  \ open-source culture and contribute to other projects that may not directly fall\
  \ within your team\u2019s scope&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;As we are remote-first\
  \ and our engineering organization is entirely remote, we provide guidance and meet\
  \ regularly using video calls, so an independent attitude, good communication skills,\
  \ and transparency are a must.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What Makes You a\
  \ Great Fit:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Strong 8+ years of experience\
  \ with at least one programming language. We use Go, but do not require candidates\
  \ with Go experience. Long term experience in any major language (Python, .NET,\
  \ Java, Rust, etc) with a willingness to learn Go is acceptable.&lt;/li&gt; &lt;li&gt;Demonstrated\
  \ experience working with and monitoring Kubernetes in a production environment&lt;/li&gt;\
  \ &lt;li&gt;Experience with cloud-based software development and production systems&lt;/li&gt;\
  \ &lt;li&gt;Experience writing clean, maintainable, robust, and performant software&lt;/li&gt;\
  \ &lt;li&gt;Familiarity with observability tooling (e.g. Grafana, Prometheus, Loki,\
  \ OpenTelemetry)&lt;/li&gt; &lt;li&gt;Experience with delivering projects from start\
  \ to finish in a self-driven manner&lt;/li&gt; &lt;li&gt;Experience in a hands-on\
  \ technical leadership role, setting technical direction and leading project teams&lt;/li&gt;\
  \ &lt;li&gt;Experience with distributed systems&lt;/li&gt; &lt;li&gt;Excellent problem-solving\
  \ and debugging skills&lt;/li&gt; &lt;li&gt;Strong mentoring and leadership skills&lt;/li&gt;\
  \ &lt;li&gt;Experience participating in an on-call rotation and incident management&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus Points For:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Experience designing and building observability backends\
  \ for various systems and applications&lt;/li&gt; &lt;li&gt;Experience contributing\
  \ to or maintaining open source projects, with evidence of successful pull requests\
  \ and community collaboration&lt;/li&gt; &lt;li&gt;In-depth knowledge cloud platform\
  \ internals&lt;/li&gt; &lt;li&gt;Strong understanding of metrics collection, visualization,\
  \ and alerting concepts&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Compensation\
  \ &amp;amp; Rewards:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;In Sweden, the Base compensation\
  \ range for this role is SEK 775,444&lt;span data-sheets-root=&quot;1&quot;&gt;&amp;nbsp;&lt;/span&gt;-\
  \ SEK 930,533. Actual compensation may vary based on level, experience, and skillset\
  \ as assessed throughout the interview process. All of our roles include Restricted\
  \ Stock Units (RSUs), giving every team member ownership in Grafana Labs&#39; success.\
  \ We believe in shared outcomes\u2014RSUs help us stay aligned and invested as we\
  \ scale globally.&lt;/p&gt; &lt;p&gt;&lt;span style=&quot;color: rgb(236, 240, 241);&quot;&gt;#LI-Remote&lt;/span&gt;&lt;/p&gt;&lt;div\
  \ class=&quot;content-conclusion&quot;&gt;&lt;div&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation\
  \ ranges are country specific. If you are applying for this role from a different\
  \ location than listed above, your recruiter will discuss your specific market\u2019\
  s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
