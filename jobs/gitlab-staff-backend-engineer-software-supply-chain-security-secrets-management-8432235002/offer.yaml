  raw: "remote remote staff backend engineer, software supply chain security: secrets\
    \ management &lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;gitlab is the\
    \ intelligent orchestration platform for devsecops. gitlab enables organizations\
    \ to increase developer productivity, improve operational efficiency, reduce security\
    \ and compliance risk, and accelerate digital transformation. more than 50 million\
    \ registered users and more than 50% of the fortune 100* trust gitlab to ship\
    \ better, more secure software faster.&lt;/p&gt; &lt;p&gt;the same principles\
    \ built into our products are reflected in how our team works: we embrace ai as\
    \ a core productivity multiplier, with all team members expected to incorporate\
    \ ai into their daily workflows to drive efficiency, innovation, and impact. gitlab\
    \ is where careers accelerate, innovation flourishes, and every voice is valued.\
    \ our high-performance culture is driven by our &lt;a href=&quot;https://handbook.gitlab.com/handbook/values/&quot;&gt;values&lt;/a&gt;\
    \ and continuous knowledge exchange, enabling our team members to reach their\
    \ full potential while collaborating with industry leaders to solve complex problems.\
    \ &lt;a href=&quot;https://www.youtube.com/watch?v=ouzib5zszqi&quot;&gt;co-create\
    \ the future with us&lt;/a&gt; as we build technology that transforms how the\
    \ world develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;fortune 500\xAE is a\
    \ registered trademark of fortune media ip limited, used under license. claim\
    \ based on gitlab data. fortune 100 refers to the top 20% ranked companies in\
    \ the 2025 fortune 500 list, published in june 2025. fortune and fortune media\
    \ ip limited are not affiliated with, and do not endorse products or services\
    \ of gitlab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h4&gt;an overview of this role&lt;/h4&gt;\
    \ &lt;p&gt;you&#39;ll join gitlab&#39;s software supply chain security stage as\
    \ the &lt;span class=&quot;textbold&quot;&gt;staff engineer, secrets management&lt;/span&gt;,\
    \ providing technical leadership for gitlab&#39;s strategic investment in integrated\
    \ secrets management. you&#39;ll set the technical direction for gitlab secrets\
    \ manager, our openbao-powered solution that helps customers securely store, distribute,\
    \ and manage the lifecycle of secrets used across ci/cd pipelines. this role sits\
    \ at the intersection of the gitlab platform and the openbao open source project:\
    \ you&#39;ll drive architecture decisions for multi-tenant secrets management\
    \ at scale, guide integration into gitlab, and contribute upstream so we can deliver\
    \ capabilities customers can trust.&lt;/p&gt; &lt;p&gt;in your first year, your\
    \ success will look like a clear, scalable architecture for gitlab secrets manager,\
    \ reliable performance that meets gitlab.com needs in partnership with infrastructure\
    \ teams, and strong cross-team alignment across pipeline security, authentication,\
    \ and platform. you&#39;ll also represent gitlab in openbao&#39;s governance and\
    \ technical discussions, helping ensure our product direction and upstream contributions\
    \ reinforce each other.&lt;/p&gt; &lt;h4&gt;how we interview&lt;/h4&gt; &lt;p&gt;our\
    \ process includes technical interviews and stakeholder conversations focused\
    \ on how you partner across functions and drive alignment.&lt;/p&gt; &lt;p&gt;you\
    \ should expect questions about how you collaborate with cross-functional partners\
    \ and communicate tradeoffs in ambiguous, high-impact work.&lt;/p&gt; &lt;h4&gt;what\
    \ you&#39;ll do&lt;/h4&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;lead the technical\
    \ strategy for gitlab secrets manager, setting architecture direction for secure,\
    \ multi-tenant secrets management at scale.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;own\
    \ the integration between gitlab and openbao, including namespaces, authentication\
    \ mechanisms, and policy management.&lt;/li&gt; &lt;li value=&quot;3&quot;&gt;collaborate\
    \ with pipeline security, authentication, and platform teams to propose, review,\
    \ and deliver cross-team secrets management improvements.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;partner\
    \ with gitlab.com infrastructure teams to ensure secrets management meets reliability,\
    \ performance, and operational requirements.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;represent\
    \ gitlab in the openbao open source project by contributing features upstream,\
    \ participating in technical steering discussions, and maintaining strong technical\
    \ credibility.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;mentor and advise engineers\
    \ on secrets management, cryptographic systems, and secure architecture patterns,\
    \ raising the quality and consistency of designs and implementations.&lt;/li&gt;\
    \ &lt;li value=&quot;7&quot;&gt;interface with engineering managers and senior\
    \ leadership to scope initiatives, clarify tradeoffs, and unblock delivery across\
    \ teams.&lt;/li&gt; &lt;li value=&quot;8&quot;&gt;engage with customers and external\
    \ stakeholders to understand real-world needs and communicate gitlab&#39;s secrets\
    \ management capabilities and roadmap direction.&lt;/li&gt; &lt;/ul&gt; &lt;h4&gt;what\
    \ you&#39;ll bring&lt;/h4&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;experience\
    \ designing and operating secrets management systems (for example, hashicorp vault,\
    \ openbao, or cloud-native offerings), including secure storage, access control,\
    \ and audit logging.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;ability to lead\
    \ architecture decisions for resilient, multi-tenant services that handle secrets\
    \ operations at scale, including high availability and cluster management patterns.&lt;/li&gt;\
    \ &lt;li value=&quot;3&quot;&gt;working knowledge of cryptographic and key management\
    \ concepts, such as encryption in transit and at rest, key derivation, and hardware\
    \ security module (hsm) or pkcs#11 integrations.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;experience\
    \ implementing authentication and authorization integrations, such as json web\
    \ token (jwt) or openid connect (oidc), mutual transport layer security (mtls),\
    \ and certificate-based authentication.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;proficiency\
    \ building product integrations in go (within the openbao or vault ecosystem)\
    \ and ruby on rails for gitlab platform integration.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;experience\
    \ contributing to open source projects and working effectively with distributed\
    \ governance, balancing upstream needs with product requirements.&lt;/li&gt; &lt;li\
    \ value=&quot;7&quot;&gt;demonstrated ability to operate with high autonomy, drive\
    \ strategy, and serve as a trusted partner to senior leaders (including constructively\
    \ challenging assumptions and tradeoffs).&lt;/li&gt; &lt;li value=&quot;8&quot;&gt;strong\
    \ communication and collaboration skills to influence across teams and levels,\
    \ including mentoring engineers and working in a fully remote, asynchronous environment.&lt;/li&gt;\
    \ &lt;/ul&gt; &lt;h4&gt;about the team&lt;/h4&gt; &lt;p&gt;the secrets management\
    \ team sits within the pipeline security group in gitlab&#39;s software supply\
    \ chain security stage. we own gitlab secrets manager, an openbao-powered capability\
    \ that helps teams securely store, distribute, and manage the lifecycle of secrets\
    \ used across continuous integration and continuous delivery (ci/cd) pipelines.\
    \ the team works closely with authentication, authorization, compliance, and platform\
    \ counterparts to deliver secure defaults, reliable operations for gitlab.com,\
