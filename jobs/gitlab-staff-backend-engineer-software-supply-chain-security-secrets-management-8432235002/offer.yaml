job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;GitLab is\
  \ the intelligent orchestration platform for DevSecOps. GitLab enables organizations\
  \ to increase developer productivity, improve operational efficiency, reduce security\
  \ and compliance risk, and accelerate digital transformation. More than 50 million\
  \ registered users and more than 50% of the Fortune 100* trust GitLab to ship better,\
  \ more secure software faster.&lt;/p&gt; &lt;p&gt;The same principles built into\
  \ our products are reflected in how our team works: we embrace AI as a core productivity\
  \ multiplier, with all team members expected to incorporate AI into their daily\
  \ workflows to drive efficiency, innovation, and impact. GitLab is where careers\
  \ accelerate, innovation flourishes, and every voice is valued. Our high-performance\
  \ culture is driven by our &lt;a href=&quot;https://handbook.gitlab.com/handbook/values/&quot;&gt;values&lt;/a&gt;\
  \ and continuous knowledge exchange, enabling our team members to reach their full\
  \ potential while collaborating with industry leaders to solve complex problems.\
  \ &lt;a href=&quot;https://www.youtube.com/watch?v=OuZIb5zszQI&quot;&gt;Co-create\
  \ the future with us&lt;/a&gt; as we build technology that transforms how the world\
  \ develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;Fortune 500\xAE is a registered\
  \ trademark of Fortune Media IP Limited, used under license. Claim based on GitLab\
  \ data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500\
  \ list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated\
  \ with, and do not endorse products or services of GitLab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h4&gt;An\
  \ overview of this role&lt;/h4&gt; &lt;p&gt;You&#39;ll join GitLab&#39;s Software\
  \ Supply Chain Security stage as the &lt;span class=&quot;textBold&quot;&gt;Staff\
  \ Engineer, Secrets Management&lt;/span&gt;, providing technical leadership for\
  \ GitLab&#39;s strategic investment in integrated secrets management. You&#39;ll\
  \ set the technical direction for GitLab Secrets Manager, our OpenBao-powered solution\
  \ that helps customers securely store, distribute, and manage the lifecycle of secrets\
  \ used across CI/CD pipelines. This role sits at the intersection of the GitLab\
  \ platform and the OpenBao open source project: you&#39;ll drive architecture decisions\
  \ for multi-tenant secrets management at scale, guide integration into GitLab, and\
  \ contribute upstream so we can deliver capabilities customers can trust.&lt;/p&gt;\
  \ &lt;p&gt;In your first year, your success will look like a clear, scalable architecture\
  \ for GitLab Secrets Manager, reliable performance that meets GitLab.com needs in\
  \ partnership with Infrastructure teams, and strong cross-team alignment across\
  \ Pipeline Security, Authentication, and Platform. You&#39;ll also represent GitLab\
  \ in OpenBao&#39;s governance and technical discussions, helping ensure our product\
  \ direction and upstream contributions reinforce each other.&lt;/p&gt; &lt;h4&gt;How\
  \ we interview&lt;/h4&gt; &lt;p&gt;Our process includes technical interviews and\
  \ stakeholder conversations focused on how you partner across functions and drive\
  \ alignment.&lt;/p&gt; &lt;p&gt;You should expect questions about how you collaborate\
  \ with cross-functional partners and communicate tradeoffs in ambiguous, high-impact\
  \ work.&lt;/p&gt; &lt;h4&gt;What you&#39;ll do&lt;/h4&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Lead\
  \ the technical strategy for GitLab Secrets Manager, setting architecture direction\
  \ for secure, multi-tenant secrets management at scale.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Own\
  \ the integration between GitLab and OpenBao, including namespaces, authentication\
  \ mechanisms, and policy management.&lt;/li&gt; &lt;li value=&quot;3&quot;&gt;Collaborate\
  \ with Pipeline Security, Authentication, and Platform teams to propose, review,\
  \ and deliver cross-team secrets management improvements.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;Partner\
  \ with GitLab.com Infrastructure teams to ensure secrets management meets reliability,\
  \ performance, and operational requirements.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;Represent\
  \ GitLab in the OpenBao open source project by contributing features upstream, participating\
  \ in technical steering discussions, and maintaining strong technical credibility.&lt;/li&gt;\
  \ &lt;li value=&quot;6&quot;&gt;Mentor and advise engineers on secrets management,\
  \ cryptographic systems, and secure architecture patterns, raising the quality and\
  \ consistency of designs and implementations.&lt;/li&gt; &lt;li value=&quot;7&quot;&gt;Interface\
  \ with engineering managers and senior leadership to scope initiatives, clarify\
  \ tradeoffs, and unblock delivery across teams.&lt;/li&gt; &lt;li value=&quot;8&quot;&gt;Engage\
  \ with customers and external stakeholders to understand real-world needs and communicate\
  \ GitLab&#39;s secrets management capabilities and roadmap direction.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h4&gt;What you&#39;ll bring&lt;/h4&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Experience\
  \ designing and operating secrets management systems (for example, HashiCorp Vault,\
  \ OpenBao, or cloud-native offerings), including secure storage, access control,\
  \ and audit logging.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Ability to lead architecture\
  \ decisions for resilient, multi-tenant services that handle secrets operations\
  \ at scale, including high availability and cluster management patterns.&lt;/li&gt;\
  \ &lt;li value=&quot;3&quot;&gt;Working knowledge of cryptographic and key management\
  \ concepts, such as encryption in transit and at rest, key derivation, and hardware\
  \ security module (HSM) or PKCS#11 integrations.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;Experience\
  \ implementing authentication and authorization integrations, such as JSON Web Token\
  \ (JWT) or OpenID Connect (OIDC), mutual Transport Layer Security (mTLS), and certificate-based\
  \ authentication.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;Proficiency building\
  \ product integrations in Go (within the OpenBao or Vault ecosystem) and Ruby on\
  \ Rails for GitLab platform integration.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;Experience\
  \ contributing to open source projects and working effectively with distributed\
  \ governance, balancing upstream needs with product requirements.&lt;/li&gt; &lt;li\
  \ value=&quot;7&quot;&gt;Demonstrated ability to operate with high autonomy, drive\
  \ strategy, and serve as a trusted partner to senior leaders (including constructively\
  \ challenging assumptions and tradeoffs).&lt;/li&gt; &lt;li value=&quot;8&quot;&gt;Strong\
  \ communication and collaboration skills to influence across teams and levels, including\
  \ mentoring engineers and working in a fully remote, asynchronous environment.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h4&gt;About the team&lt;/h4&gt; &lt;p&gt;The Secrets Management\
  \ team sits within the Pipeline Security group in GitLab&#39;s Software Supply Chain\
  \ Security stage. We own GitLab Secrets Manager, an OpenBao-powered capability that\
  \ helps teams securely store, distribute, and manage the lifecycle of secrets used\
  \ across continuous integration and continuous delivery (CI/CD) pipelines. The team\
  \ works closely with Authentication, Authorization, Compliance, and Platform counterparts\
  \ to deliver secure defaults, reliable operations for GitLab.com, and product-grade\
  \ integration between GitLab and OpenBao (including namespaces, authentication,\
  \ and policy management). Our core challenge is building multi-tenant secrets management\
  \ at scale while balancing upstream open source collaboration with the needs of\
  \ GitLab customers.&lt;/p&gt;&lt;div class=&quot;content-pay-transparency&quot;&gt;&lt;div\
  \ class=&quot;pay-input&quot;&gt;&lt;div class=&quot;description&quot;&gt;&lt;p&gt;&lt;em&gt;The\
  \ base salary range for this role\u2019s listed level is currently for residents\
  \ of the&amp;nbsp;United States only. This range is intended to reflect the role&#39;s\
  \ base salary rate in locations throughout the US.&amp;nbsp;Grade level and salary\
  \ ranges are determined through interviews and a review of education, experience,\
  \ knowledge, skills, abilities of the applicant, equity with other team members,\
  \ alignment with market data,&amp;nbsp;and geographic location.&amp;nbsp;The base\
  \ salary range does not include any bonuses, equity, or benefits. See more information\
  \ on our &lt;a class=&quot;waffle-rich-text-link&quot; href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/&quot;\
