  raw: "remote spain (remote) senior software engineer - grafana k6 | spain | remote\
    \ &lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;grafana labs is a remote-first,\
    \ open-source powerhouse. there are more than 20m users of grafana, the open source\
    \ visualization tool, around the globe, monitoring everything from beehives to\
    \ climate change in the alps. the instantly recognizable dashboards have been\
    \ spotted everywhere from a nasa launch and minecraft hq to wimbledon and the\
    \ tour de france. grafana labs also helps more than 3,000 companies -- including\
    \ bloomberg, jpmorgan chase, and ebay -- manage their observability strategies\
    \ with the grafana lgtm stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;grafana\
    \ cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;grafana\
    \ enterprise stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;grafana\
    \ mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;grafana\
    \ loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;grafana\
    \ tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;we\u2019re scaling fast and staying true\
    \ to what makes us different: an open-source legacy, a global collaborative culture,\
    \ and a passion for meaningful work. our team thrives in an innovation-driven\
    \ environment where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt;\
    \ &lt;p&gt;you may not meet every requirement, and that\u2019s okay. if this role\
    \ excites you, we\u2019d love you to raise your hand for what could be a truly\
    \ career-defining opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;this\
    \ is a remote opportunity and we would be interested in applicants from spain\
    \ timezones.&lt;/strong&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;senior software\
    \ engineer - grafana k6&amp;nbsp;&lt;/strong&gt;&lt;/h2&gt; &lt;h4&gt;&lt;strong&gt;the\
    \ opportunity:&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt; &lt;p&gt;at k6, we build reliability\
    \ and performance testing tools for developers and qa engineers.&lt;/p&gt; &lt;p&gt;&lt;a\
    \ href=&quot;https://grafana.com/docs/k6/latest/&quot;&gt;grafana k6&lt;/a&gt;\
    \ is an open-source project focused on making performance testing practical, approachable,\
    \ and useful in real-world engineering workflows. we care deeply about developer\
    \ experience, correctness, and scalability. k6 is part of the grafana ecosystem\
    \ and is used by engineers to test and understand systems under real load.&lt;/p&gt;\
    \ &lt;p&gt;&lt;strong&gt;what you\u2019ll be doing:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;you\
    \ will join a team of engineers responsible for building and maintaining k6, a\
    \ performance testing tool written in go. the team also maintains the open-source\
    \ project, which means working directly on the product, the codebase, and with\
    \ the community using it.&lt;/p&gt; &lt;p&gt;in this role, you will work on features\
    \ and improvements across the &lt;a href=&quot;https://github.com/grafana/k6&quot;&gt;k6\
    \ codebase&lt;/a&gt;, from initial idea through implementation and delivery. much\
    \ of the work involves problems that are not fully specified up front and require\
    \ understanding the context, evaluating trade-offs, and choosing a reasonable\
    \ technical approach.&lt;/p&gt; &lt;p&gt;you will work with a high degree of independence\
    \ while collaborating closely with other engineers on design, implementation,\
    \ and code reviews. you are expected to deliver production-quality code, maintain\
    \ existing functionality, and help keep the system reliable and maintainable over\
    \ time.&lt;/p&gt; &lt;p&gt;some work may involve the k6 cloud offering, which\
    \ builds on top of k6 to run distributed tests across data centers worldwide.\
    \ this includes go services that support distributed execution and require careful\
    \ attention to performance, correctness, and failure modes.&lt;/p&gt; &lt;p&gt;because\
    \ the team is small, your work will have a direct and visible impact on the product\
    \ and its users. you will work alongside experienced engineers in an environment\
    \ that values clarity, pragmatism, and sound engineering judgment.&lt;/p&gt; &lt;p&gt;we\
    \ start with problems, not prescriptions. engineers are expected to understand\
    \ the constraints, propose a pragmatic design, and carry the work through to delivery.\
    \ we move deliberately and release on a regular cadence of roughly every six weeks.\
    \ between releases, we focus on small, safe, incremental changes.&lt;/p&gt; &lt;p&gt;work\
    \ is asynchronous by default, with decisions captured in pull requests and short\
    \ design notes. meetings are used for alignment rather than status updates. code\
    \ reviews focus on correctness, long-term maintainability, and user impact. when\
    \ trade-offs are required, we aim to make them explicit and reversible. the team\
    \ owns the product end to end, including architecture, releases, user-facing behavior,\
    \ and the health of the open-source project.&lt;/p&gt; &lt;p&gt;we invest heavily\
    \ in developer productivity. you can use modern ai coding assistants as part of\
    \ your daily workflow (your choice of tools, within security guidelines), backed\
    \ by a company-funded usage budget so you can iterate quickly without unnecessary\
    \ friction.&amp;nbsp;we encourage pragmatic ai-assisted development: faster prototyping,\
    \ test generation, refactors, documentation, and incident follow-ups\u2014always\
    \ paired with strong code review and quality standards.&amp;nbsp;you\u2019ll also\
    \ have access to frontier models (e.g., gpt-codex 5/3, claude opus 4.6, gemini\
    \ 3 pro).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;what makes you a great fit:&lt;/strong&gt;&lt;/p&gt;\
    \ &lt;p&gt;we\u2019re looking for an experienced engineer with strong programming\
    \ skills and a track record of working on non-trivial systems.&lt;/p&gt; &lt;p&gt;you\
    \ should have:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;strong experience building production\
    \ software in go, or another language with good support for concurrency and parallelism&lt;/li&gt;\
    \ &lt;li&gt;experience working on larger or long-lived codebases&lt;/li&gt; &lt;li&gt;the\
    \ ability to work independently on scoped problems and deliver them to completion&lt;/li&gt;\
    \ &lt;li&gt;clear technical communication skills, especially in code reviews and\
    \ design discussions&lt;/li&gt; &lt;li&gt;a good understanding of internet protocols\
    \ such as http, grpc, and websockets, with some familiarity with lower-level networking\
    \ concepts&lt;/li&gt; &lt;li&gt;experience with modern development practices,\
    \ including testing, code review, and iterative development&lt;/li&gt; &lt;/ul&gt;\
    \ &lt;p&gt;&lt;strong&gt;bonus points for:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;you\
