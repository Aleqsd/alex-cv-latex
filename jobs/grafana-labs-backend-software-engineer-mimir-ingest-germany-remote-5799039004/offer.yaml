job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;This is a remote opportunity and we would be interested\
  \ in applicants based in Spain, Germany, Ireland the UK or Sweden at this time.&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Backend Software Engineer - Mimir Ingest&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;The Opportunity:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What\
  \ is Grafana Cloud?&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Grafana Cloud is\
  \ our composable observability platform that integrates metrics, logs, traces, and\
  \ profiles with Grafana. It allows our customers to leverage the best open source\
  \ observability software \u2013 including Prometheus, Mimir, Loki, Tempo, and Pyroscope\
  \ \u2013 without the overhead of installing, maintaining and scaling their own observability\
  \ stack.&lt;/p&gt; &lt;p&gt;The Databases team owns and operates the telemetry databases\
  \ that are&lt;a href=&quot;https://github.com/grafana/mimir&quot;&gt; Mimir for\
  \ metrics&lt;/a&gt;,&lt;a href=&quot;https://github.com/grafana/loki&quot;&gt; Loki\
  \ for logs&lt;/a&gt;,&lt;a href=&quot;https://github.com/grafana/tempo&quot;&gt;\
  \ Tempo for traces&lt;/a&gt;, and&lt;a href=&quot;https://github.com/grafana/pyroscope&quot;&gt;\
  \ Pyroscope for profiles&lt;/a&gt;. Our databases are offered as a hosted service\
  \ in Grafana Cloud, and additionally as on-premise solutions with &lt;a href=&quot;https://grafana.com/products/enterprise/metrics/&quot;&gt;Grafana\
  \ Enterprise Metrics&lt;/a&gt;, &lt;a href=&quot;https://grafana.com/products/enterprise/logs/&quot;&gt;Grafana\
  \ Enterprise Logs&lt;/a&gt;, and &lt;a href=&quot;https://grafana.com/blog/2021/11/09/introducing-grafana-enterprise-traces/&quot;&gt;Grafana\
  \ Enterprise Traces&lt;/a&gt;. They are multi-tenant distributed systems implemented\
  \ in Go and operating at scale on Kubernetes across all major Cloud service providers\
  \ (AWS, GCP, Azure).&lt;/p&gt; &lt;p&gt;As a company we are remote-first and global,\
  \ we embrace people of different experiences and backgrounds to build diverse teams\
  \ where every person brings a new perspective to the software.&amp;nbsp;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Mimir Squad&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;The Mimir\
  \ squad has 3 sub-squads, Ingest, Storage, and Query, which together maintain the\
  \ &lt;a href=&quot;https://github.com/grafana/mimir&quot;&gt;Mimir OSS project&lt;/a&gt;,\
  \ and additionally own and operate Grafana Cloud Metrics across 3 major cloud providers.\
  \ Engineers on the team focus on optimizing the efficiency and resilience of processing,\
  \ storing, and querying metrics at large volumes. These services operate at a large\
  \ scale and performance is key to keeping the offering competitive and running smoothly.&lt;/p&gt;\
  \ &lt;p&gt;A Mimir engineer has various work streams. They are likely engaged in\
  \ a larger project with another engineer, and they are also incorporating some performance\
  \ and reliability improvements discovered through operating the system in production.\
  \ They are also responsible for writing and reviewing PRs and design documents from\
  \ other engineers in the squad, shepherding automated release rollouts, and participating\
  \ in the on-call rotation for their systems.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What\
  \ will you be doing?&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Take\
  \ an active role in influencing our roadmap and your own career objectives&amp;nbsp;&lt;/li&gt;\
  \ &lt;li&gt;Work with your team to deliver new features, then use the results to\
  \ iterate and improve.&lt;/li&gt; &lt;li&gt;Help your team drive projects from initial\
  \ idea all the way to operations once it is in the hands of customers&lt;/li&gt;\
  \ &lt;li&gt;Embrace our open-source culture and contribute to other projects that\
  \ may not directly fall within your team\u2019s scope&lt;/li&gt; &lt;li&gt;Build,\
  \ operate, and maintain critical systems, owning the reliability, performance, and\
  \ availability&lt;/li&gt; &lt;li&gt;Be a part of your team\u2019s follow-the-sun\
  \ on-call rotations and take ownership of the services you\u2019re running&lt;/li&gt;\
  \ &lt;li&gt;Support other team members, participate in design discussions and collaborate\
  \ with the team&lt;/li&gt; &lt;li&gt;Learn new skills by gaining a deeper understanding\
  \ of our cloud product and our customers and getting to know the codebase of a large\
  \ distributed system&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;As we are remote-first and\
  \ our engineering organization is largely remote, we provide guidance and meet regularly\
  \ using video calls, so an independent attitude and good communication skills are\
  \ a must.&lt;/p&gt; &lt;p&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What Makes You a\
  \ Great Fit:&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;&lt;/ul&gt; &lt;p&gt;&lt;strong&gt;You\
  \ are a motivated self starter with a bias towards action. You are customer focused.\
  \ We build everything with our users in mind. You have a passion for building intuitive\
  \ products that fit customers\u2019 needs. You have good time management skills,\
  \ which you leverage to work on the right things at the right time.&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Pragmatism: You have a bias towards action, taking direction\
  \ and building a plan of action to analyze, design, and build modular solutions,\
  \ deliver MVPs, gather data and feedback and then progress iteratively&lt;/li&gt;\
  \ &lt;li&gt;Collaboration and communication: The smallest unit we have is a squad.\
  \ You\u2019ll be working with your teammates in a fully remote setup. Good communication\
  \ and time management skills are a must&lt;/li&gt; &lt;li&gt;AI: some experience\
  \ using LLMs for day to day coding tasks and understanding a codebase.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;ul&gt; &lt;li&gt;Experience with at least one programming language.\
  \ We use Go, but if you have familiarity with Python, C, C++, Rust or similar then\
  \ that translates well&lt;/li&gt; &lt;li&gt;Some experience with delivering projects\
  \ as a member of a larger team. Your experience includes gathering requirements\
  \ and brainstorming ideas, all the way to shipping features to the customer\u2019\
  s hands.&lt;/li&gt; &lt;li&gt;Some experience with developing software that runs\
  \ in the Cloud &lt;em&gt;or&lt;/em&gt; some experience with systems engineering&lt;/li&gt;\
  \ &lt;li&gt;Some experience with being on-call and following the DevOps model&lt;/li&gt;\
  \ &lt;li&gt;Experience writing clean, robust, and performant software that is easily\
  \ maintained by others&lt;/li&gt; &lt;li&gt;Some familiarity with observability\
  \ systems, know when to use metrics, logs, traces, to debug a problem.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Bonus Points For:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt;&lt;/ul&gt; &lt;ul&gt; &lt;li&gt;Experience working with Kubernetes&lt;/li&gt;\
  \ &lt;li&gt;Experience working with queue systems, e.g. the Kafka protocol&lt;/li&gt;\
  \ &lt;li&gt;Been a user of Grafana and Prometheus in operational roles (including\
  \ on-call for your team at a previous employer or just using these tools on hobby/homelab\
  \ projects)&lt;/li&gt; &lt;li&gt;Exposure to microservices architecture and distributed\
  \ systems, or a desire to learn&lt;/li&gt; &lt;li&gt;Familiarity with the concept\
  \ of infrastructure as code&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;In Germany, the compensation range for this role is EUR 76K - EUR 95K.\
  \ Actual compensation may vary based on level, experience, and skillset as assessed\
  \ throughout the interview process. All of our roles include Restricted Stock Units\
  \ (RSUs), giving every team member ownership in Grafana Labs&#39; success. We believe\
  \ in shared outcomes\u2014RSUs help us stay aligned and invested as we scale globally.&lt;/p&gt;&lt;div\
  \ class=&quot;content-conclusion&quot;&gt;&lt;div&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation\
  \ ranges are country specific. If you are applying for this role from a different\
  \ location than listed above, your recruiter will discuss your specific market\u2019\
  s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
