    \ automated release rollouts, and participating in the on-call rotation for their\
    \ systems.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;what will you be doing?&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\
