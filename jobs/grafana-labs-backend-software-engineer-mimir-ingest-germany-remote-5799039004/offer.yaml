  raw: "remote germany (remote) backend software engineer - mimir ingest | germany\
    \ | remote &lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;grafana labs is\
    \ a remote-first, open-source powerhouse. there are more than 20m users of grafana,\
    \ the open source visualization tool, around the globe, monitoring everything\
    \ from beehives to climate change in the alps. the instantly recognizable dashboards\
    \ have been spotted everywhere from a nasa launch and minecraft hq to wimbledon\
    \ and the tour de france. grafana labs also helps more than 3,000 companies --\
    \ including bloomberg, jpmorgan chase, and ebay -- manage their observability\
    \ strategies with the grafana lgtm stack, which can be run fully managed with\
    \ &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;grafana cloud&lt;/a&gt;\
