job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;GitLab is\
  \ the intelligent orchestration platform for DevSecOps. GitLab enables organizations\
  \ to increase developer productivity, improve operational efficiency, reduce security\
  \ and compliance risk, and accelerate digital transformation. More than 50 million\
  \ registered users and more than 50% of the Fortune 100* trust GitLab to ship better,\
  \ more secure software faster.&lt;/p&gt; &lt;p&gt;The same principles built into\
  \ our products are reflected in how our team works: we embrace AI as a core productivity\
  \ multiplier, with all team members expected to incorporate AI into their daily\
  \ workflows to drive efficiency, innovation, and impact. GitLab is where careers\
  \ accelerate, innovation flourishes, and every voice is valued. Our high-performance\
  \ culture is driven by our &lt;a href=&quot;https://handbook.gitlab.com/handbook/values/&quot;&gt;values&lt;/a&gt;\
  \ and continuous knowledge exchange, enabling our team members to reach their full\
  \ potential while collaborating with industry leaders to solve complex problems.\
  \ &lt;a href=&quot;https://www.youtube.com/watch?v=OuZIb5zszQI&quot;&gt;Co-create\
  \ the future with us&lt;/a&gt; as we build technology that transforms how the world\
  \ develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;Fortune 500\xAE is a registered\
  \ trademark of Fortune Media IP Limited, used under license. Claim based on GitLab\
  \ data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500\
  \ list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated\
  \ with, and do not endorse products or services of GitLab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;p&gt;An\
  \ overview of this role&lt;/p&gt; &lt;p&gt;As a Senior Backend Engineer, you&#39;ll\
  \ lead the design and development of a unified, Go-based instrumentation service\
  \ that consolidates analytics instrumentation across GitLab&#39;s engineering organization.\
  \ You&#39;ll architect and own critical backend systems that help the company understand\
  \ customer usage patterns across GitLab SaaS and Self-Managed deployment environments.\
  \ That data directly informs strategic product decisions. This role offers the opportunity\
  \ to build foundational infrastructure that simplifies instrumentation for every\
  \ team at GitLab, replacing the complexity of multiple language-specific SDKs with\
  \ a single, unified solution that all teams can rely on.&lt;/p&gt; &lt;h2&gt;What\
  \ you&#39;ll do&lt;/h2&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Design, build,\
  \ and maintain a unified Go-based instrumentation service that consolidates instrumentation\
  \ across the entire company, eliminating the need for multiple language-specific\
  \ SDKs while maintaining reliability and performance.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Own\
  \ the responsibility for handling the sending, transit, and quality of instrumentation\
  \ data across the system, ensuring data integrity that directly impacts the company&#39;s\
  \ strategic decision-making and usage billing accuracy.&lt;/li&gt; &lt;li value=&quot;3&quot;&gt;Train\
  \ and support product development teams across the company on how to instrument\
  \ their features using the unified service, providing documentation, guidance, and\
  \ technical support.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;Manage on-call responsibilities\
  \ during working hours for systems responsible for usage billing and instrumentation,\
  \ ensuring system reliability and quick response to critical issues.&lt;/li&gt;\
  \ &lt;li value=&quot;5&quot;&gt;Lead collaboration across research and development\
  \ teams and the enterprise data organization to understand requirements and deliver\
  \ solutions that serve multiple stakeholders.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;Make\
  \ strategic architectural decisions that balance the needs of product teams (who\
  \ need ease of use) with data consumers (who need reliability and correctness),\
  \ ensuring the system serves as a foundational service for the company.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;What you&#39;ll bring&lt;/h2&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;Proficiency\
  \ in the Go programming language, with experience building and maintaining production\
  \ services.&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;Strong backend development\
  \ experience, with the ability to design scalable, reliable systems serving internal\
  \ and external customers.&lt;/li&gt; &lt;li value=&quot;3&quot;&gt;Experience with\
  \ infrastructure concerns such as system reliability, performance at scale, data\
  \ quality, and observability.&lt;/li&gt; &lt;li value=&quot;4&quot;&gt;Experience\
  \ designing and building APIs (REST, gRPC, or similar) that other teams integrate\
  \ with.&lt;/li&gt; &lt;li value=&quot;5&quot;&gt;Experience working in collaborative,\
  \ cross-functional teams with product teams, data consumers, and other internal\
  \ stakeholders across team boundaries.&lt;/li&gt; &lt;li value=&quot;6&quot;&gt;Experience\
  \ with instrumentation, analytics, data systems, or similar foundational infrastructure\
  \ is helpful, along with Ruby on Rails experience.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About\
  \ the team&lt;/h2&gt; &lt;p&gt;&lt;br&gt;Our team is part of the Data Engineering\
  \ organization and operates as a foundational service supporting all research and\
  \ development teams at GitLab. We&#39;re responsible for consolidating and managing\
  \ the systems that handle instrumentation data sending, transit, and quality across\
  \ the entire company. Our work directly enables company strategy and decision-making\
  \ by providing visibility into customer usage patterns across different product\
  \ offerings and customer types (GitLab SaaS and Self-Managed deployment environments).\
  \ This work supports usage billing and product decisions. We&#39;re building a unified,\
  \ Go-based instrumentation service that replaces multiple language-specific SDKs,\
  \ making it easier for teams to instrument their features while we ensure data integrity\
  \ for billing and analysis. As a distributed team working asynchronously across\
  \ multiple time zones, we collaborate closely with product and engineering teams\
  \ across the company and provide training and support to help them instrument their\
  \ features effectively.&lt;/p&gt;&lt;div class=&quot;content-pay-transparency&quot;&gt;&lt;div\
  \ class=&quot;pay-input&quot;&gt;&lt;div class=&quot;description&quot;&gt;&lt;p&gt;&lt;em&gt;The\
  \ base salary range for this role\u2019s listed level is currently for residents\
  \ of the&amp;nbsp;United States only. This range is intended to reflect the role&#39;s\
  \ base salary rate in locations throughout the US.&amp;nbsp;Grade level and salary\
  \ ranges are determined through interviews and a review of education, experience,\
  \ knowledge, skills, abilities of the applicant, equity with other team members,\
  \ alignment with market data,&amp;nbsp;and geographic location.&amp;nbsp;The base\
  \ salary range does not include any bonuses, equity, or benefits. See more information\
  \ on our &lt;a class=&quot;waffle-rich-text-link&quot; href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/&quot;\
  \ data-sheets-formula-bar-text-link=&quot;https://bit.ly/GLBeneUS&quot; data-sheets-formula-bar-text-style=&quot;font-size:12px;color:#1155cc;font-weight:normal;text-decoration:underline;font-family:&#39;&#39;Arial&#39;&#39;;font-style:normal;text-decoration-skip-ink:none;&quot;&gt;benefits&lt;/a&gt;&lt;span\
  \ data-sheets-formula-bar-text-style=&quot;font-size:12px;color:#000000;font-weight:normal;text-decoration:none;font-family:&#39;Arial&#39;;font-style:normal;text-decoration-skip-ink:none;&quot;&gt;\
  \ and &lt;/span&gt;&lt;a class=&quot;waffle-rich-text-link&quot; href=&quot;https://about.gitlab.com/handbook/stock-options/&quot;\
  \ data-sheets-formula-bar-text-link=&quot;https://bit.ly/GLequity&quot; data-sheets-formula-bar-text-style=&quot;font-size:12px;color:#1155cc;font-weight:normal;text-decoration:underline;font-family:&#39;&#39;Arial&#39;&#39;;font-style:normal;text-decoration-skip-ink:none;&quot;&gt;equity&lt;/a&gt;.\
  \ Sales roles are also eligible for incentive pay targeted at up to 100% of the\
