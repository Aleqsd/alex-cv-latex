job_description_raw: "&lt;p&gt;Mixmax is the #1 product helping Revenue teams to become\
  \ automatically proactive by eliminating busywork for a flawless customer experience&lt;/p&gt;\
  \ &lt;h3&gt;&lt;strong&gt;The Opportunity&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;We\u2019\
  re looking for a Senior Software Engineer (Platform) who wants high ownership: leading\
  \ projects end-to-end, improving how services in our Node.js/TypeScript stack are\
  \ built and operated, and creating paved paths that reduce toil across engineering.\
  \ &lt;strong&gt;This is not a traditional DevOps or SRE role.&lt;/strong&gt; We\u2019\
  re looking for a strong software engineer who is comfortable working in our Node.js/TypeScript\
  \ ecosystem while improving platform and infrastructure capabilities.&lt;/p&gt;\
  \ &lt;p&gt;This role can be based in LATAM or Europe. We cannot hire in the USA\
  \ for this position.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;Within your first few months,\
  \ you&#39;ll:&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Ship meaningful improvements\
  \ to our infrastructure, reliability and developer experience&lt;/li&gt; &lt;li&gt;Take\
  \ ownership of key platform areas and processes&lt;/li&gt; &lt;li&gt;Partner with\
  \ product engineers to understand pain points, unblock delivery, and raise standards\
  \ and improve how we operate&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;Preferred\
  \ skills and background:&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li style=&quot;font-weight:\
  \ bold;&quot;&gt;&lt;strong&gt;Strong experience with TypeScript/Node.js&amp;nbsp;&lt;/strong&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: bold;&quot;&gt;&lt;strong&gt;Experience designing\
  \ and operating production workloads on AWS, including services such as ECS/Fargate,\
  \ Lambda, API Gateway, EventBridge, Application Load Balancers, and VPC networking.&lt;/strong&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-weight: bold;&quot;&gt;&lt;strong&gt;Familiarity with\
  \ infrastructure-as-code (Terraform)&lt;/strong&gt;&lt;/li&gt; &lt;li&gt;Experience\
  \ operating and supporting the systems you build, not just shipping and moving on&lt;/li&gt;\
  \ &lt;li&gt;Clear written communication. We&#39;re a distributed team, and documentation\
  \ matters&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;It&#39;s also awesome (but\
  \ not required) for you to have:&lt;/strong&gt;&lt;/h3&gt; &lt;ul&gt; &lt;li&gt;Experience\
  \ with MongoDB, OpenSearch/Elasticsearch, or Redis/Valkey&lt;/li&gt; &lt;li&gt;Familiarity\
  \ with observability tooling (OpenTelemetry, Datadog, etc.)&lt;/li&gt; &lt;li&gt;Experience\
  \ building internal platforms or developer tools&lt;/li&gt; &lt;li&gt;Familiarity\
  \ with microservices / event-driven / serverless architectures&lt;/li&gt; &lt;li&gt;Experience\
  \ with networking (DNS, load balancing, VPCs, etc.)&lt;/li&gt; &lt;/ul&gt; &lt;h3&gt;&lt;strong&gt;How\
  \ we work&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;We\u2019re a globally distributed team.&lt;/p&gt;\
  \ &lt;p&gt;We default to asynchronous communication, keep meetings lightweight,\
  \ and rely on strong written docs to stay aligned. Our core stack is Node.js/TypeScript,\
  \ React, MongoDB, and AWS. We mainly use Jira and Slack day-to-day.&lt;/p&gt; &lt;h3&gt;&lt;strong&gt;The\
  \ Mixmax Story&lt;/strong&gt;&lt;/h3&gt; &lt;p&gt;At Mixmax, our vision is a world\
  \ without busywork. Since our launch in 2015, Mixmax has become the product of choice\
  \ for over 10,000 Sales and Customer Success teams to eliminate and automate repetitive\
  \ work. This means more time to focus on what matters: engaging and serving the\
  \ needs of customers.&lt;/p&gt; &lt;p&gt;We\u2019re extraordinarily proud of the\
  \ company we\u2019ve built. We\u2019re a driven, passionate, responsible group that\
  \ values personal and professional growth equally. We take care of ourselves, our\
  \ families, our customers, and one another. We believe in sustainable and diverse\
  \ approaches to work and life, because optimizing for the long-term is the best\
  \ path to success.&lt;/p&gt; &lt;p&gt;Our company is globally distributed, with\
  \ remote team members worldwide. We offer competitive salaries, meaningful equity,\
  \ and generous benefits. And with Mixmax, you get to work on a product people love.&lt;/p&gt;\
  \ &lt;p&gt;\U0001F49C &lt;strong&gt;Why Mixmax?&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;\
  \ &lt;li&gt;We\u2019re a product-led company with strong product\u2013market fit,\
  \ ambitious new AI initiatives, and a clear mission&lt;/li&gt; &lt;li&gt;You\u2019\
  ll join at a pivotal moment - shaping the next generation of our platform and helping\
  \ define how Mixmax scales technically and culturally.&lt;/li&gt; &lt;li&gt;You\u2019\
  ll work in a team that values ownership, creativity, and building things that matter,\
  \ where good ideas can come from anywhere.&lt;/li&gt; &lt;li&gt;You\u2019ll have\
  \ autonomy, trust, and direct access to leadership, with the support to explore\
  \ high-leverage opportunities and make real impact.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Ready\
  \ to lead and build at scale with a team that moves fast and cares deeply? We\u2019\
  d love to hear from you.&lt;/p&gt;"
