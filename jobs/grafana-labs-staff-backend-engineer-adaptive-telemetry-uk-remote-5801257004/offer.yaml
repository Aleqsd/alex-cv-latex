job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;&amp;nbsp;&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;Staff\
  \ Backend Engineer - Adaptive Telemetry&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;This\
  \ role is available for candidates located in the UK, Germany, Spain, Ireland and\
  \ Sweden.&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;The Opportunity:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;What is Grafana Cloud?&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Grafana\
  \ Cloud is our composable observability platform that integrates metrics, logs,\
  \ traces, and profiles with Grafana. It allows our customers to leverage the best\
  \ open source observability software \u2013 including Prometheus, Mimir, Loki, Tempo,\
  \ and Pyroscope \u2013 without the overhead of installing, maintaining and scaling\
  \ their own observability stack.&lt;/p&gt; &lt;p&gt;The Databases department owns\
  \ and operates the telemetry databases that are&lt;a href=&quot;https://github.com/grafana/mimir&quot;&gt;\
  \ Mimir for metrics&lt;/a&gt;,&lt;a href=&quot;https://github.com/grafana/loki&quot;&gt;\
  \ Loki for logs&lt;/a&gt;,&lt;a href=&quot;https://github.com/grafana/tempo&quot;&gt;\
  \ Tempo for traces&lt;/a&gt;, and&lt;a href=&quot;https://github.com/grafana/pyroscope&quot;&gt;\
  \ Pyroscope for profiles&lt;/a&gt;. We offer our databases as a Cloud service supporting\
  \ Grafana Cloud.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Adaptive Telemetry Group&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;The Adaptive Telemetry group, part of the Databases department, has the\
  \ mission of ensuring that all telemetry stored in our databases is worthy of attention.\
  \ Under that mission, the group is responsible for the development of &lt;a href=&quot;https://grafana.com/docs/grafana-cloud/cost-management-and-billing/reduce-costs/metrics-costs/control-metrics-usage-via-adaptive-metrics/&quot;&gt;Adaptive\
  \ Metrics&lt;/a&gt;, &lt;a href=&quot;https://grafana.com/docs/grafana-cloud/cost-management-and-billing/reduce-costs/logs-costs/adaptive-logs/&quot;&gt;Adaptive\
  \ Logs&lt;/a&gt;, &lt;a href=&quot;https://grafana.com/docs/grafana-cloud/adaptive-telemetry/adaptive-traces/&quot;&gt;Adaptive\
  \ Traces&lt;/a&gt; and Adaptive Profiles.&lt;/p&gt; &lt;p&gt;Our Adaptive Telemetry\
  \ solutions give users the ability to control and optimize their telemetry data.\
  \ These solutions ensure that data storage is optimized based on individual usage\
  \ patterns, so only the most valuable data is retained.&lt;/p&gt; &lt;p&gt;As a\
  \ company we are remote-first and global, we embrace people of different experiences\
  \ and backgrounds to build diverse teams where every person brings a new perspective\
  \ to the software.&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What will you be doing:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Drive technical strategy and roadmap.&lt;/strong&gt;\
  \ Proactively define the architectural vision, prioritize work that unlocks major\
  \ product or platform improvements, and influence product and engineering decisions.&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Lead end-to-end delivery of large, cross-functional projects.&lt;/strong&gt;\
  \ Own planning, design, execution, rollout and long-term operation of large initiatives.&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Own architecture, reliability, performance and cost for\
  \ critical systems.&lt;/strong&gt; Make pragmatic architecture choices that balance\
  \ scalability, availability, latency and cost while ensuring systems remain maintainable\
  \ and evolvable.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Define SLOs/SLIs\
  \ and lead incident response.&lt;/strong&gt; Establish measurable reliability targets,\
  \ run high-severity incident response, lead blameless post-mortems, and drive systemic\
  \ fixes and automation to prevent recurrence.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Improve\
  \ observability, automation and operational readiness.&lt;/strong&gt; Champion telemetry,\
  \ alerting, runbooks, capacity planning and automation efforts that reduce toil,\
  \ speed debugging and lower MTTR.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Align\
  \ stakeholders and remove blockers.&lt;/strong&gt; Coordinate across Product, Design\
  \ and other teams to align priorities, negotiate tradeoffs, and unblock delivery\
  \ for large initiatives.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Mentor\
  \ and grow engineering talent.&lt;/strong&gt; Coach senior and mid-level engineers,\
  \ lead design reviews, raise engineering standards, and help teammates make sound\
  \ technical tradeoffs.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Represent\
  \ engineering internally and externally.&lt;/strong&gt; Communicate technical strategy\
  \ clearly to non-engineering stakeholders and represent the team in cross-team planning.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;We invest heavily in developer productivity. You can use\
  \ modern AI coding assistants as part of your daily workflow (your choice of tools,\
  \ within security guidelines), backed by a company-funded usage budget so you can\
  \ iterate quickly without unnecessary friction.&lt;/p&gt; &lt;p&gt;We encourage\
  \ pragmatic AI-assisted development: faster prototyping, test generation, refactors,\
  \ documentation, and incident follow-ups\u2014always paired with strong code review\
  \ and quality standards.&lt;/p&gt; &lt;p&gt;You\u2019ll also have access to frontier\
  \ models (e.g., GPT-Codex 5/3, Claude Opus 4.6, Gemini 3 Pro).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What\
  \ makes you a great fit:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;You are\
  \ a motivated self starter with a bias towards action. You are customer focused.\
  \ We build everything with our users in mind. You have a passion for creating intuitive\
  \ products that fit customers\u2019 needs&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt;\
  \ &lt;li&gt;&lt;strong&gt;Proven delivery of large distributed systems.&lt;/strong&gt;\
  \ Experience shipping and operating complex systems that span multiple teams, with\
  \ clear evidence of technical leadership and impact.&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Strong systems-design instincts.&lt;/strong&gt; Deep understanding\
  \ of tradeoffs around latency, consistency, availability, scaling and cost.&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Hands-on cloud and platform experience.&lt;/strong&gt;\
  \ Solid experience with cloud-native architectures (microservices, containers/Kubernetes,\
  \ IaC) and the operational practices that keep them healthy.&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Reliability and performance ownership.&lt;/strong&gt;\
  \ Comfortable defining SLOs/SLIs, doing capacity planning, tuning performance, and\
  \ driving reliability work end-to-end.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Excellent\
  \ coding and design skills.&lt;/strong&gt; You write clear, maintainable, well-tested\
  \ code and can lead technical designs \u2014 we use Go, but Python/C/C++/Rust or\
  \ similar translate well.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Comfort\
  \ with AI-assisted development. &lt;/strong&gt;We embrace AI and agentic development\
  \ so we expect you to be curious and comfortable using AI-powered developer tools\
  \ and ideally have practical experience folding them into a team\u2019s workflow.\
  \ &lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Experience with messaging\
  \ and telemetry.&lt;/strong&gt; Familiarity with streaming/messaging systems (e.g.,\
  \ Kafka) and observability tooling (Prometheus/Grafana or equivalents).&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Influence without authority.&lt;/strong&gt; Ability to\
  \ align cross-functional stakeholders, set priorities and drive outcomes in a remote-first\
  \ environment.&lt;br&gt;&lt;br&gt;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Strong communicator.&lt;/strong&gt;\
  \ Clear written and verbal communication that works across engineers and non-technical\
  \ stakeholders.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt; &lt;p&gt;&lt;strong&gt;Compensation\
  \ &amp;amp; Rewards:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;In the UK, the Base compensation\
  \ range for this role is &lt;span data-sheets-root=&quot;1&quot;&gt;\xA3100,000\
  \ - \xA3124,000.&lt;/span&gt;&amp;nbsp;Actual compensation may vary based on level,\
  \ experience, and skillset as assessed in the interview process. Benefits include\
  \ equity, bonus (if applicable) and other benefits listed &lt;a class=&quot;c-link&quot;\
  \ href=&quot;https://grafana.com/about/careers/#jobs&quot; target=&quot;_blank&quot;\
  \ data-stringify-link=&quot;https://grafana.com/about/careers/#jobs&quot; data-sk=&quot;tooltip_parent&quot;&gt;here&lt;/a&gt;.&lt;/p&gt;&lt;div\
  \ class=&quot;content-conclusion&quot;&gt;&lt;div&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation\
  \ ranges are country specific. If you are applying for this role from a different\
  \ location than listed above, your recruiter will discuss your specific market\u2019\
  s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
