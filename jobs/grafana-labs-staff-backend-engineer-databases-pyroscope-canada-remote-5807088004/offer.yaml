job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;h4&gt;This is a remote position in US and\
  \ Canada.&amp;nbsp;&lt;/h4&gt; &lt;h4&gt;&lt;strong&gt;The Opportunity:&lt;/strong&gt;&lt;/h4&gt;\
  \ &lt;p&gt;We are the creators of &lt;a href=&quot;https://github.com/grafana/Pyroscope&quot;&gt;Pyroscope&lt;/a&gt;,\
  \ an open-source continuous profiling database that offers rapid, scalable, highly\
  \ reliable, and efficient storage and querying capabilities. It aids in gaining\
  \ a comprehensive insight into resource utilization within applications, right down\
  \ to the specific line of code. The project seamlessly integrates with Grafana,\
  \ enabling users to correlate profiling data with metrics, logs, and traces, and\
  \ leverage profiles as a crucial component of application observability. Our dedicated\
  \ backend development team works closely with clients and the Grafana Cloud teams\
  \ to deliver profiling solutions for on-premises and cloud environments at scale.&lt;/p&gt;\
  \ &lt;p&gt;In our expansive domain, some of the projects we have undertaken include:&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Implementing distributed systems to effectively manage profile\
  \ ingestion and queries.&lt;/li&gt; &lt;li&gt;Establishing instrumentation support\
  \ for various programming languages including Golang, Dotnet, Java, Ruby, eBPF,\
  \ Python, Node.js, and Rust.&lt;/li&gt; &lt;li&gt;Built &amp;amp; Enhanced the functionality\
  \ of the Pyroscope plugins to provide users with an intuitive interface for exploring\
  \ and analyzing application profiles.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;This position\
  \ focuses on implementing distributed systems to effectively manage profile ingestion\
  \ and queries.&lt;/p&gt; &lt;p&gt;Pyroscope is trusted by leading multinational\
  \ companies for essential applications and infrastructure. We prioritize innovation\
  \ and inclusivity, empowering every team member to share ideas that improve our\
  \ product as a dependable solution.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What You&#39;ll\
  \ Be Doing:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Collaborate\
  \ with your team to deliver new features, analyze outcomes, and make improvements&lt;/li&gt;\
  \ &lt;li&gt;Lead projects from concept to implementation, including ongoing customer\
  \ support&lt;/li&gt; &lt;li&gt;Design, build, operate, and maintain essential systems,\
  \ ensuring reliability, performance, and availability&lt;/li&gt; &lt;li&gt;Take\
  \ an active role in influencing our roadmap and your own career objectives&amp;nbsp;&lt;/li&gt;\
  \ &lt;li&gt;Participate in on-call rotations and take responsibility for the services\
  \ you oversee&lt;/li&gt; &lt;li&gt;Support and mentor team members, engage in design\
  \ conversations, and work closely with colleagues&lt;/li&gt; &lt;li&gt;Expand your\
  \ skill set by deepening your knowledge of our cloud products, understanding our\
  \ customers, and learning about our codebase&lt;/li&gt; &lt;li&gt;As we have embraced\
  \ a remote-first approach and our engineering team is primarily remote, it is essential\
  \ to possess strong communication skills and the ability to work independently.\
  \ We provide support and hold regular meetings through video calls to ensure effective\
  \ collaboration and alignment.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;We invest heavily\
  \ in developer productivity. You can use modern AI coding assistants as part of\
  \ your daily workflow (your choice of tools, within security guidelines), backed\
  \ by a company-funded usage budget so you can iterate quickly without unnecessary\
  \ friction.&lt;br&gt;&lt;br&gt;We encourage pragmatic AI-assisted development: faster\
  \ prototyping, test generation, refactors, documentation, and incident follow-ups\u2014\
  always paired with strong code review and quality standards.&lt;br&gt;&lt;br&gt;You\u2019\
  ll also have access to frontier models (e.g., GPT-Codex 5/3, Claude Opus 4.6, Gemini\
  \ 3 Pro).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What Makes You a Great Fit:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;You are a motivated self-starter with a bias toward action&lt;/li&gt;\
  \ &lt;li&gt;We build everything with our users in mind.&lt;/li&gt; &lt;li&gt;You\
  \ have a passion for creating intuitive products that fit customers\u2019 needs.&lt;/li&gt;\
  \ &lt;li&gt;Pragmatism: You are able to take on complex challenges and break them\
  \ down to achieve short feedback loops: to analyze, design, and build modular solutions,\
  \ deliver MVPs, gather data and feedback and then progress iteratively&lt;/li&gt;\
  \ &lt;li&gt;Collaboration and communication: The smallest unit we have is a team.\
  \ You\u2019ll be working with your teammates in a fully remote setup. Good communication\
  \ skills are a must&lt;/li&gt; &lt;li&gt;Solid experience with at least one programming\
  \ language. We use Go, but if you have familiarity with Python, C, C++, Rust or\
  \ similar, then that translates well&lt;/li&gt; &lt;li&gt;Some experience with delivering\
  \ projects from gathering requirements, brainstorming ideas all the way to shipping\
  \ a product to the customer\u2019s hands in a self-driven way&lt;/li&gt; &lt;li&gt;Strong\
  \ experience with designing and developing software that runs in the Cloud &lt;em&gt;or&lt;/em&gt;\
  \ experience with systems engineering&lt;/li&gt; &lt;li&gt;Experience writing clean,\
  \ robust, and performant software that is easily maintained by others.&lt;/li&gt;\
  \ &lt;li&gt;Experience with being on-call and performing operations/SRE tasks or\
  \ with the concept of infrastructure as code&lt;/li&gt; &lt;li&gt;Solid experience\
  \ with distributed systems&lt;/li&gt; &lt;li&gt;Experience working with Kubernetes&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Bonus Points For:&amp;nbsp;&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Been a user of Grafana and Prometheus in operational roles\
  \ (including on-call for your team at a previous employer or just using these tools\
  \ on hobby/homelab projects)&lt;/li&gt; &lt;li&gt;Exposure to microservices architecture&lt;/li&gt;\
  \ &lt;li&gt;Databases backend experience&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;In Canada,\
  \ the compensation range for this role is $186,368 - $223,642 CAD. Actual compensation\
  \ may vary based on level, experience, and skillset as assessed throughout the interview\
  \ process. All of our roles include Restricted Stock Units (RSUs), giving every\
  \ team member ownership in Grafana Labs&#39; success. We believe in shared outcomes\u2014\
  RSUs help us stay aligned and invested as we scale globally.&lt;/p&gt; &lt;p&gt;&amp;nbsp;&lt;/p&gt;&lt;div\
  \ class=&quot;content-conclusion&quot;&gt;&lt;div&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation\
  \ ranges are country specific. If you are applying for this role from a different\
  \ location than listed above, your recruiter will discuss your specific market\u2019\
  s defined pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
