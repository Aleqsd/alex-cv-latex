  \ data-stringify-link=&quot;https://www.notion.so/remotecom/Working-Async-at-Remote-80c01cd443ad4c77a8ceaef7c5fba5d0&quot;\
  \ data-sk=&quot;tooltip_parent&quot;&gt;async&lt;/a&gt;)&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-size: 12pt;&quot; data-stringify-indent=&quot;0&quot;\
  \ data-stringify-border=&quot;0&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;16\
  \ weeks paid parental leave&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-size:\
  \ 12pt;&quot; data-stringify-indent=&quot;0&quot; data-stringify-border=&quot;0&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt;&quot;&gt;mental health support services&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-size: 12pt;&quot; data-stringify-indent=&quot;0&quot;\
  \ data-stringify-border=&quot;0&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;stock\
  \ options&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-size: 12pt;&quot; data-stringify-indent=&quot;0&quot;\
  \ data-stringify-border=&quot;0&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;learning\
  \ budget&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-size: 12pt;&quot; data-stringify-indent=&quot;0&quot;\
  \ data-stringify-border=&quot;0&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;home\
  \ office budget &amp;amp; IT equipment&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-size:\
  \ 12pt;&quot; data-stringify-indent=&quot;0&quot; data-stringify-border=&quot;0&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt;&quot;&gt;budget for local in-person social events\
  \ or co-working spaces&lt;/span&gt;&lt;/li&gt; &lt;/ul&gt; &lt;/div&gt; &lt;h2&gt;&lt;strong&gt;How\
  \ you\u2019ll plan your day (and life)&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;&lt;span\
  \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;We\
  \ work async at Remote which means you can plan your schedule around your life (and\
  \ not around meetings). Read more at &lt;a href=&quot;https://remote.com/async&quot;\
  \ target=&quot;_blank&quot;&gt;remote.com/async&lt;/a&gt;.&lt;/span&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;span style=&quot;font-size: 12pt; font-family: helvetica, arial,\
  \ sans-serif;&quot;&gt;You will be empowered to take ownership and be proactive.\
  \ When in doubt you will default to action instead of waiting. Your &lt;strong&gt;life-work\
  \ balance&lt;/strong&gt; is important and you will be encouraged to put yourself\
  \ and your family first, and fit work around your needs.&lt;/span&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;span style=&quot;font-size: 12pt; font-family: helvetica, arial,\
  \ sans-serif;&quot;&gt;If that sounds like something you want, apply now!&lt;/span&gt;&lt;/p&gt;\
  \ &lt;h2&gt;&lt;strong&gt;How to apply&lt;/strong&gt;&lt;/h2&gt; &lt;ol&gt; &lt;li\
  \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;Please\
  \ fill out the form below and upload your CV with a PDF format.&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;&lt;strong\
  \ data-stringify-type=&quot;bold&quot;&gt;We kindly ask you to submit your application\
  \ and CV in English, as this is the standardised language we use here at Remote.&lt;/strong&gt;&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;\
  \ text-align: left;&quot;&gt;&lt;span style=&quot;font-size: 12pt; font-family:\
  \ helvetica, arial, sans-serif;&quot;&gt;If you don\u2019t have an up to date CV\
  \ but you are still interested in talking to us, please feel free to add a copy\
  \ of your LinkedIn profile instead.&lt;/span&gt;&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;&lt;span\
  \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;Not\
  \ only do we encourage folks from all ethnic groups, genders, sexuality, age, abilities,\
  \ disability status and any other under-represented group to apply, but we prioritize\
  \ a sense of belonging. We have 4 ERGs (Women, Disability, Queer, Minorities in\
  \ Tech) who meet regularly with the People team. During your interviews and beyond,\
  \ we ask &amp;amp; encourage anybody who needs an accommodation to request one from\
  \ their recruiter.&lt;br&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span style=&quot;font-size:\
  \ 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;We will ask you to voluntarily\
  \ tell us your pronouns at interview stage, and you will have the option to answer\
  \ our anonymous demographic questionnaire when you apply below. As an equal employment\
  \ opportunity employer it\u2019s important to us that our workforce reflects people\
  \ of all backgrounds, identities, and experiences and this data will help us to\
  \ stay accountable. We thank you for providing this data, if you chose to.&lt;/span&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;span style=&quot;font-size: 12pt; font-family: helvetica, arial,\
  \ sans-serif;&quot;&gt;At Remote, we embrace AI as a valuable tool while prioritizing\
  \ human creativity and authenticity.&amp;nbsp;We look forward to meeting candidates\
  \ who balance innovation with genuine expertise and experience.&amp;nbsp;To learn\
  \ more about Remote&#39;s AI guidelines check see&amp;nbsp;&lt;a href=&quot;https://www.notion.so/remotecom/Guidelines-on-using-AI-when-applying-for-a-job-at-Remote-11ccb4dadab4805f80a7c73b6567bd8f&quot;\
  \ target=&quot;_blank&quot; data-saferedirecturl=&quot;https://www.google.com/url?q=https://www.notion.so/remotecom/Guidelines-on-using-AI-when-applying-for-a-job-at-Remote-11ccb4dadab4805f80a7c73b6567bd8f&amp;amp;source=gmail&amp;amp;ust=1733927526443000&amp;amp;usg=AOvVaw2sIVooKuyGfRra1PtGXreV&quot;&gt;here&lt;/a&gt;.&amp;nbsp;&lt;/span&gt;&lt;br&gt;&lt;br&gt;&lt;span\
  \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;&lt;em&gt;Please\
  \ note we accept applications on an ongoing basis.&amp;nbsp;&lt;/em&gt;&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;"
