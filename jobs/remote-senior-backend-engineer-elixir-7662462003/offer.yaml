job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;h2&gt;&lt;strong&gt;About\
  \ Remote&lt;/strong&gt;&lt;/h2&gt; &lt;div&gt;&lt;span style=&quot;font-size: 12pt;\
  \ font-family: helvetica, arial, sans-serif;&quot;&gt;Remote is solving modern organizations\u2019\
  \ biggest challenge \u2013 navigating global employment compliantly with ease. We\
  \ make it possible for businesses of all sizes to recruit, pay, and manage international\
  \ teams. With our core values at heart and future focused work culture, our team\
  \ works tirelessly on ambitious problems, asynchronously, around the world. You\
  \ can find Remoters working from 6 different continents (Antarctica left to go!)\
  \ and all of our positions are fully remote.&lt;br&gt;&lt;br&gt;&lt;span class=&quot;discussion-id-2f7cb4da-dab4-8068-a80f-001c50b2d808\
  \ suggestion-update notion-enable-hover&quot; data-token-index=&quot;0&quot;&gt;With\
  \ Innovation as one of the core values, we have built Automation and AI capabilities\
  \ into the requirements for every role.&lt;/span&gt;&lt;br&gt;&lt;br&gt;We encourage\
  \ every member of the Remote team to bring their talents, experiences and culture\
  \ to the table to help us build the best-in-class HR platform.&lt;/span&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt; &lt;div&gt;&lt;span style=&quot;font-size: 12pt;\
  \ font-family: helvetica, arial, sans-serif;&quot;&gt;If you are energetic, curious,\
  \ motivated and ambitious, be part of our world. Apply now and define the future\
  \ of work!&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;h2&gt;The position&lt;/h2&gt;\
  \ &lt;p&gt;You&#39;ll be joining a team of engineers across Frontend, Backend, SRE\
  \ and QA. We&#39;re organised into cross-functional development teams assigned to\
  \ specific verticals.&lt;/p&gt; &lt;p&gt;This role is open for several teams, and\
  \ we will define the exact team that you will be joining during the interview process\
  \ based on the business needs and your preferences.&lt;/p&gt; &lt;p&gt;Regardless\
  \ of the specific team, you will be working on building tools, APIs and integrations\
  \ for one of our products.&lt;/p&gt; &lt;p&gt;&lt;span class=&quot;discussion-level-1\
  \ discussion-id-1ef18a0b-804d-46bf-8480-aaec7f18761e notion-enable-hover&quot; data-token-index=&quot;0&quot;\
  \ data-reactroot=&quot;&quot;&gt;Our backend is built with Elixir and Phoenix, with\
  \ a Postgres database. We use React and Nextjs for our front-end. Gitlab is used\
  \ as a version control tool, issue tracker and a CI/CD solution. Our applications\
  \ are hosted on AWS. We fully rely on our CI for deployments and deploy multiple\
  \ times per day.&lt;/span&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;What this job can\
  \ offer you&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Complex and meaningful\
  \ challenges \u2014 solving them will enable people and businesses to live and operate\
  \ in any country of the world.&lt;/li&gt; &lt;li&gt;Opportunity to have a significant\
  \ impact on the business \u2014 we are still very early in our journey as a company,\
  \ and each change you make today is amplified by the company&#39;s growth.&lt;/li&gt;\
  \ &lt;li&gt;A lot of freedom to organize your work and life \u2014&amp;nbsp;you\
  \ are not bound to daily standups, recurring meetings or other ceremonies.&lt;/li&gt;\
  \ &lt;li&gt;Competitive salary, stock options, flexible paid time off, and a set\
  \ of perks and benefits.&lt;/li&gt; &lt;li&gt;A supportive and kind work environment\
  \ where we would like you to challenge the dogmas and pursue innovation!&lt;/li&gt;\
  \ &lt;li&gt;Strong team of experienced engineers who will support and facilitate\
  \ your professional growth.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What you bring&lt;/h2&gt;\
  \ &lt;p&gt;&lt;strong&gt;Must have (professional experience):&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Significant experience as a Backend Engineer working with\
  \ Elixir, which includes building, shipping and maintaining a complicated software\
  \ project&lt;/li&gt; &lt;li&gt;Postgres (or similar)&lt;/li&gt; &lt;li&gt;CI/CD\
  \ (GitLab, Github, Jenkins or similar)&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Nice\
  \ to have&lt;/strong&gt;&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Kubernetes&lt;/li&gt; &lt;li&gt;Docker&lt;/li&gt;\
  \ &lt;li&gt;AWS&lt;/li&gt; &lt;li&gt;Nextjs&lt;/li&gt; &lt;li&gt;React/Vue/Angular&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;&lt;span class=&quot;notion-enable-hover&quot; data-token-index=&quot;0&quot;&gt;Key\
  \ Responsibilities&lt;/span&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Lead the development\
  \ of major team-scoped projects, participate in cross-team initiatives&lt;/li&gt;\
  \ &lt;li&gt;Actively participate in product work in the team: provide feedback,\
  \ suggest solutions to the problems. Use technical insights and expertise to suggest\
  \ product improvements&lt;/li&gt; &lt;li&gt;Maintain good understanding of the team\u2019\
  s domain, both from product and engineering sides&lt;/li&gt; &lt;li&gt;Provide feedback\
  \ on code reviews&lt;/li&gt; &lt;li&gt;Contribute to the shared codebase&lt;/li&gt;\
  \ &lt;li&gt;Debug and solve technical and business issues&lt;/li&gt; &lt;li&gt;Participate\
  \ in non-team activities, such as support rotations, hiring process, RFC discussions,\
  \ etc&lt;/li&gt; &lt;li&gt;Mentor and provide guidance to other engineers&lt;/li&gt;\
  \ &lt;li&gt;Investigate, propose and participate in implementation of improvements\
  \ to our platform&lt;/li&gt; &lt;li&gt;Design and implement APIs with performance,\
  \ scalability, and maintainability in mind&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;Practicals&lt;/h2&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Reporting line: &lt;/strong&gt;Engineering\
  \ Team Leader&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Team:&lt;/strong&gt; Engineering&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Location&lt;/strong&gt;: Anywhere in the World&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Start date&lt;/strong&gt;: As soon as possible&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Application process&lt;/strong&gt;&lt;/h2&gt;\
  \ &lt;ol&gt; &lt;li&gt;Interview with our recruiter&lt;/li&gt; &lt;li&gt;Interview\
  \ with an Engineering Leader&lt;/li&gt; &lt;li&gt;(async) Code exercise and&amp;nbsp;review&lt;/li&gt;\
  \ &lt;li&gt;Interview with members of the engineering team&lt;/li&gt; &lt;li&gt;Bar\
  \ Raiser Interview&lt;/li&gt; &lt;li&gt;Executive Interview with VP of Engineering&lt;/li&gt;\
  \ &lt;li&gt;Offer and&amp;nbsp;&lt;a href=&quot;https://www.notion.so/96e108c037b8423cbd4c3f07a1f9b38b?pvs=21&quot;&gt;Prior\
  \ employment verification check&lt;/a&gt;&lt;/li&gt; &lt;/ol&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;h2&gt;&lt;strong&gt;Benefits&lt;/strong&gt;&lt;/h2&gt;\
  \ &lt;div class=&quot;p-rich_text_section&quot;&gt; &lt;div class=&quot;p-rich_text_section&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt;&quot;&gt;Our full benefits &amp;amp; perks are explained\
  \ in our handbook at&amp;nbsp;&lt;a class=&quot;c-link&quot; href=&quot;http://remote.com/r/benefits&quot;\
  \ target=&quot;_blank&quot; data-stringify-link=&quot;http://remote.com/r/benefits&quot;\
  \ data-sk=&quot;tooltip_parent&quot;&gt;remote.com/r/benefits&lt;/a&gt;. As a global\
  \ company, each country works differently, but some benefits/perks are for all Remoters:&lt;/span&gt;&lt;/div&gt;\
  \ &lt;ul class=&quot;p-rich_text_list p-rich_text_list__bullet&quot; data-stringify-type=&quot;unordered-list&quot;\
  \ data-indent=&quot;0&quot; data-border=&quot;0&quot;&gt; &lt;li style=&quot;font-size:\
  \ 12pt;&quot; data-stringify-indent=&quot;0&quot; data-stringify-border=&quot;0&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt;&quot;&gt;work from anywhere&lt;/span&gt;&lt;/li&gt;\
  \ &lt;li style=&quot;font-size: 12pt;&quot; data-stringify-indent=&quot;0&quot;\
  \ data-stringify-border=&quot;0&quot;&gt;&lt;span style=&quot;font-size: 12pt;&quot;&gt;flexible\
  \ paid time off&lt;/span&gt;&lt;/li&gt; &lt;li style=&quot;font-size: 12pt;&quot;\
  \ data-stringify-indent=&quot;0&quot; data-stringify-border=&quot;0&quot;&gt;&lt;span\
  \ style=&quot;font-size: 12pt;&quot;&gt;flexible working hours (we are&amp;nbsp;&lt;a\
