    \ only do we encourage folks from all ethnic groups, genders, sexuality, age,\
    \ abilities, disability status and any other under-represented group to apply,\
    \ but we prioritize a sense of belonging. we have 4 ergs (women, disability, queer,\
    \ minorities in tech) who meet regularly with the people team. during your interviews\
    \ and beyond, we ask &amp;amp; encourage anybody who needs an accommodation to\
    \ request one from their recruiter.&lt;br&gt;&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span\
    \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;we\
    \ will ask you to voluntarily tell us your pronouns at interview stage, and you\
    \ will have the option to answer our anonymous demographic questionnaire when\
    \ you apply below. as an equal employment opportunity employer it\u2019s important\
    \ to us that our workforce reflects people of all backgrounds, identities, and\
    \ experiences and this data will help us to stay accountable. we thank you for\
    \ providing this data, if you chose to.&lt;/span&gt;&lt;/p&gt; &lt;p&gt;&lt;span\
    \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;at\
    \ remote, we embrace ai as a valuable tool while prioritizing human creativity\
    \ and authenticity.&amp;nbsp;we look forward to meeting candidates who balance\
    \ innovation with genuine expertise and experience.&amp;nbsp;to learn more about\
    \ remote&#39;s ai guidelines check see&amp;nbsp;&lt;a href=&quot;https://www.notion.so/remotecom/guidelines-on-using-ai-when-applying-for-a-job-at-remote-11ccb4dadab4805f80a7c73b6567bd8f&quot;\
    \ target=&quot;_blank&quot; data-saferedirecturl=&quot;https://www.google.com/url?q=https://www.notion.so/remotecom/guidelines-on-using-ai-when-applying-for-a-job-at-remote-11ccb4dadab4805f80a7c73b6567bd8f&amp;amp;source=gmail&amp;amp;ust=1733927526443000&amp;amp;usg=aovvaw2sivookuygfrra1ptgxrev&quot;&gt;here&lt;/a&gt;.&amp;nbsp;&lt;/span&gt;&lt;br&gt;&lt;br&gt;&lt;span\
    \ style=&quot;font-size: 12pt; font-family: helvetica, arial, sans-serif;&quot;&gt;&lt;em&gt;please\
