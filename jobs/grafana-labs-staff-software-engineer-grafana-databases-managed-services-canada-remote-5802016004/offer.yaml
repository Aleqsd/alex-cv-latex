    \ backbone for ingestion and read/write decoupling across databases. it sits directly\
    \ on the hot path for metrics, logs, and traces, handling high-throughput, multi-consumer\
    \ workloads at massive scale.&lt;/p&gt; &lt;p&gt;in addition to streaming infrastructure,\
    \ the team works closely with high-volume analytical and storage systems that\
    \ power query-heavy and aggregation-heavy workloads, where latency, compression\
    \ behavior, storage layout, and scaling characteristics matter deeply.&lt;/p&gt;\
    \ &lt;p&gt;&lt;strong&gt;what you\u2019ll be doing:&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;as\
    \ a staff engineer on managed services, you will operate at both the system and\
    \ team level. you will help shape how we run and evolve shared database infrastructure\
    \ while remaining deeply hands-on in production. this involves:&lt;/p&gt; &lt;ul&gt;\
    \ &lt;li&gt;operating and evolving 100+ multi-cloud streaming clusters and related\
    \ database infrastructure&lt;/li&gt; &lt;li&gt;diagnosing and eliminating cross-layer\
    \ failure modes (e.g., object storage latency, noisy neighbors, control-plane\
    \ bottlenecks, query performance regressions, etc.)&lt;/li&gt; &lt;li&gt;designing\
    \ safe upgrade and rollout strategies at scale&lt;/li&gt; &lt;li&gt;improving\
    \ observability, automation, and operational ergonomics&lt;/li&gt; &lt;li&gt;partnering\
    \ closely with database and platform teams to ensure safe scaling, partitioning,\
    \ consumer fan-out, and query performance&lt;/li&gt; &lt;li&gt;working directly\
    \ with distributed systems behavior, kubernetes scheduling dynamics, storage engines,\
    \ compression trade-offs, etc.&lt;/li&gt; &lt;li&gt;serving as a primary escalation\
    \ point and on-call for relevant incidents&lt;/li&gt; &lt;li&gt;owning the relationship\
    \ with all system vendors, including warpstream labs and others.&lt;/li&gt; &lt;/ul&gt;\
    \ &lt;p&gt;at the staff level, your scope includes advanced systems ownership\
    \ and informal technical leadership:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;help define\
    \ and evolve the technical direction for operating warpstream and adjacent shared\
    \ database systems at scale&lt;/li&gt; &lt;li&gt;lead complex initiatives such\
