job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;Grafana\
  \ Labs is a remote-first, open-source powerhouse. There are more than 20M users\
  \ of Grafana, the open source visualization tool, around the globe, monitoring everything\
  \ from beehives to climate change in the Alps. The instantly recognizable dashboards\
  \ have been spotted everywhere from a NASA launch and Minecraft HQ to Wimbledon\
  \ and the Tour de France. Grafana Labs also helps more than 3,000 companies -- including\
  \ Bloomberg, JPMorgan Chase, and eBay -- manage their observability strategies with\
  \ the Grafana LGTM Stack, which can be run fully managed with &lt;a href=&quot;https://grafana.com/products/cloud/&quot;&gt;Grafana\
  \ Cloud&lt;/a&gt; or self-managed with the &lt;a href=&quot;https://grafana.com/products/enterprise/&quot;&gt;Grafana\
  \ Enterprise Stack&lt;/a&gt;, both featuring scalable metrics (&lt;a href=&quot;https://grafana.com/oss/mimir/&quot;&gt;Grafana\
  \ Mimir&lt;/a&gt;), logs (&lt;a href=&quot;https://grafana.com/oss/loki/&quot;&gt;Grafana\
  \ Loki&lt;/a&gt;), and traces (&lt;a href=&quot;https://grafana.com/oss/tempo/&quot;&gt;Grafana\
  \ Tempo&lt;/a&gt;).&lt;/p&gt; &lt;p&gt;We\u2019re scaling fast and staying true\
  \ to what makes us different: an open-source legacy, a global collaborative culture,\
  \ and a passion for meaningful work. Our team thrives in an innovation-driven environment\
  \ where transparency, autonomy, and trust fuel everything we do.&lt;/p&gt; &lt;p&gt;You\
  \ may not meet every requirement, and that\u2019s okay. If this role excites you,\
  \ we\u2019d love you to raise your hand for what could be a truly career-defining\
  \ opportunity.&lt;/p&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;This is a remote opportunity\
  \ and we would be interested in applicants from Canadian time zones only at this\
  \ time.&amp;nbsp;&lt;/strong&gt;&lt;/p&gt; &lt;h2&gt;Staff Software Engineer - Grafana\
  \ Databases, Managed Services&lt;/h2&gt; &lt;h4&gt;&lt;strong&gt;The Opportunity:&amp;nbsp;&lt;/strong&gt;&lt;/h4&gt;\
  \ &lt;p&gt;The Managed Services team is a newly formed squad within the Databases\
  \ department. It owns and operates shared, production-critical infrastructure that\
  \ powers Grafana Cloud\u2019s next-generation database products (Mimir, Loki, and\
  \ Tempo). Today, this includes operating 100+ WarpStream clusters across multiple\
  \ cloud providers and regions, with continued growth anticipated for the future.\
  \ WarpStream acts as the streaming backbone for ingestion and read/write decoupling\
  \ across databases. It sits directly on the hot path for metrics, logs, and traces,\
  \ handling high-throughput, multi-consumer workloads at massive scale.&lt;/p&gt;\
  \ &lt;p&gt;In addition to streaming infrastructure, the team works closely with\
  \ high-volume analytical and storage systems that power query-heavy and aggregation-heavy\
  \ workloads, where latency, compression behavior, storage layout, and scaling characteristics\
  \ matter deeply.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What You\u2019ll Be Doing:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;As a Staff Engineer on Managed Services, you will operate at both the\
  \ system and team level. You will help shape how we run and evolve shared database\
  \ infrastructure while remaining deeply hands-on in production. This involves:&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Operating and evolving 100+ multi-cloud streaming clusters\
  \ and related database infrastructure&lt;/li&gt; &lt;li&gt;Diagnosing and eliminating\
  \ cross-layer failure modes (e.g., object storage latency, noisy neighbors, control-plane\
  \ bottlenecks, query performance regressions, etc.)&lt;/li&gt; &lt;li&gt;Designing\
  \ safe upgrade and rollout strategies at scale&lt;/li&gt; &lt;li&gt;Improving observability,\
  \ automation, and operational ergonomics&lt;/li&gt; &lt;li&gt;Partnering closely\
  \ with database and platform teams to ensure safe scaling, partitioning, consumer\
  \ fan-out, and query performance&lt;/li&gt; &lt;li&gt;Working directly with distributed\
  \ systems behavior, Kubernetes scheduling dynamics, storage engines, compression\
  \ trade-offs, etc.&lt;/li&gt; &lt;li&gt;Serving as a primary escalation point and\
  \ on-call for relevant incidents&lt;/li&gt; &lt;li&gt;Owning the relationship with\
  \ all system vendors, including WarpStream Labs and others.&lt;/li&gt; &lt;/ul&gt;\
  \ &lt;p&gt;At the Staff level, your scope includes advanced systems ownership and\
  \ informal technical leadership:&lt;/p&gt; &lt;ul&gt; &lt;li&gt;Help define and\
  \ evolve the technical direction for operating WarpStream and adjacent shared database\
  \ systems at scale&lt;/li&gt; &lt;li&gt;Lead complex initiatives such as migrations,\
  \ rollout improvements, and reliability investments&lt;/li&gt; &lt;li&gt;Establish\
  \ best practices around SLOs, scaling limits, failure isolation, and change safety&lt;/li&gt;\
  \ &lt;li&gt;Investigate and drive resolution of multi-layer incidents spanning storage,\
  \ compute, networking, and control-plane dependencies&lt;/li&gt; &lt;li&gt;Identify\
  \ systemic risks across 100+ clusters and contribute architectural improvements\
  \ that reduce recurring issues&lt;/li&gt; &lt;li&gt;Improve systems toil and operational\
  \ ergonomics with automation&lt;/li&gt; &lt;li&gt;Partner with database and platform\
  \ teams to align on strategy and long-term scalability&lt;/li&gt; &lt;li&gt;Mentor\
  \ and support engineers as the team matures&lt;/li&gt; &lt;li&gt;As we are remote-first\
  \ and our engineering organization is largely remote, we provide guidance and meet\
  \ regularly using video calls, so an independent attitude and good communication\
  \ skills are a must.&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Of course, there is an on-call\
  \ component to this role and one that we take seriously. As a company, we hire globally\
  \ (remote-first) to ensure our on-call remains healthy and aligned to approximately\
  \ 12 daylight hours per day. You will work closely with counterparts in other regions\
  \ to provide balanced coverage and shared ownership.&lt;/p&gt; &lt;p&gt;This role\
  \ blends deep distributed systems work with the opportunity to influence how the\
  \ team approaches reliability, scaling, and operational excellence.&lt;/p&gt; &lt;p&gt;We\
  \ invest heavily in developer productivity. You can use modern AI coding assistants\
  \ as part of your daily workflow (your choice of tools, within security guidelines),\
  \ backed by a company-funded usage budget so you can iterate quickly without unnecessary\
  \ friction.&amp;nbsp;We encourage pragmatic AI-assisted development: faster prototyping,\
  \ test generation, refactors, documentation, and incident follow-ups\u2014always\
  \ paired with strong code review and quality standards.&amp;nbsp;You\u2019ll also\
  \ have access to frontier models (e.g., GPT-Codex 5/3, Claude Opus 4.6, Gemini 3\
  \ Pro).&lt;/p&gt; &lt;p&gt;&lt;strong&gt;What Makes You a Great Fit:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;Regular 1:1s with your manager and close collaboration with\
  \ teammates across regions, helping shape how the team operates and matures&lt;/li&gt;\
  \ &lt;li&gt;Defining and evolving SLO strategy for shared database infrastructure,\
  \ identifying systemic reliability gaps and driving long-term error budget improvements&lt;/li&gt;\
  \ &lt;li&gt;Setting standards for diagnosability across core streaming and database\
  \ systems in production&lt;/li&gt; &lt;li&gt;Leading complex initiatives across\
  \ high-throughput, multi-cloud infrastructure&lt;/li&gt; &lt;li&gt;Designing and\
  \ promoting fault-tolerant architectural patterns that address distributed system\
  \ realities such as storage latency, partition imbalance, noisy neighbors, and control-plane\
  \ dependencies&lt;/li&gt; &lt;li&gt;Defining rollout, migration, and upgrade safety\
  \ practices used across dozens of production clusters&lt;/li&gt; &lt;li&gt;Partnering\
  \ with database and platform engineering leaders to influence architecture decisions,\
  \ roadmap prioritization, and long-term scalability strategy&lt;/li&gt; &lt;li&gt;Leading\
  \ design discussions and reviewing PRs with a focus on reducing operational risk\
  \ and increasing system resilience&lt;/li&gt; &lt;li&gt;Raising the bar for practices\
  \ across teams by mentoring engineers and sharing distributed systems knowledge&lt;/li&gt;\
  \ &lt;li&gt;Playing a key role in high-impact incident response, guiding investigation,\
  \ driving root cause analysis, and ensuring durable remediation through strong post-incident\
  \ reviews&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Requirements:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;8+ years of engineering experience, including meaningful\
  \ time in SRE, platform engineering, production engineering, infrastructure engineering,\
  \ or distributed systems roles.&lt;/li&gt; &lt;li&gt;Experience with high-throughput\
  \ streaming systems, analytical or storage backends, or large-scale database infrastructure.\
  \ Examples of these include Kafka, Redpanda, WarpStream, Postgres, ClickHouse, Snowflake,\
  \ or Cassandra.&lt;/li&gt; &lt;li&gt;Strong Kubernetes experience in AWS, GCP, or\
  \ Azure, and familiarity with infrastructure-as-code tooling (Helm, Terraform, Jsonnet,\
  \ etc.).&lt;/li&gt; &lt;li&gt;Experience leading or driving complex technical efforts,\
  \ even without formal management responsibilities&lt;/li&gt; &lt;li&gt;Ability to\
  \ influence technical direction and align teams around reliability improvements&lt;/li&gt;\
  \ &lt;li&gt;Strong understanding of distributed systems failure modes in multi-cloud\
  \ environments.&lt;/li&gt; &lt;li&gt;Proficiency in at least one systems-oriented\
  \ language (Go preferred, but not required).&lt;/li&gt; &lt;li&gt;Working knowledge\
  \ of Linux internals, networking, cloud storage, and performance/scaling behavior.&lt;/li&gt;\
  \ &lt;li&gt;Experience participating in blameless incident response and writing\
  \ high-quality post-incident reviews.&lt;/li&gt; &lt;li&gt;Clear communicator who\
  \ can collaborate across teams and work autonomously.&lt;/li&gt; &lt;li&gt;Intellectually\
  \ curious, transparent, action-oriented, and kind (this is important!)&lt;br&gt;&lt;br&gt;&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Compensation &amp;amp; Rewards:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;p&gt;In Canada, the Base compensation range for this role is CAD &lt;span\
  \ data-sheets-root=&quot;1&quot;&gt;186,368&lt;/span&gt;&lt;span data-sheets-root=&quot;1&quot;&gt;&amp;nbsp;&lt;/span&gt;-\
  \ CAD &lt;span data-sheets-root=&quot;1&quot;&gt;223,642&lt;/span&gt;. Actual compensation\
  \ may vary based on level, experience, and skillset as assessed in the interview\
  \ process. Benefits include equity, bonus (if applicable) and other benefits listed&amp;nbsp;&lt;a\
  \ href=&quot;https://grafana.com/about/careers/#jobs&quot;&gt;here&lt;/a&gt;.&lt;/p&gt;\
  \ &lt;p&gt;All of our roles include Restricted Stock Units (RSUs), giving every\
  \ team member ownership in Grafana Labs&#39; success. We believe in shared outcomes\u2014\
  RSUs help us stay aligned and invested as we scale globally.&lt;/p&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;div&gt;\
  \ &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;*Compensation ranges\
  \ are country specific. If you are applying for this role from a different location\
  \ than listed above, your recruiter will discuss your specific market\u2019s defined\
  \ pay range &amp;amp; benefits at the beginning of the process.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Why You\u2019ll Thrive at Grafana Labs:&lt;/strong&gt;&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;strong data-stringify-type=&quot;bold&quot;&gt;100% Remote,\
  \ Global Culture -&amp;nbsp;&lt;/strong&gt;As a remote-only company, we bring together\
  \ talent from around the world, united by a culture of collaboration and shared\
  \ purpose.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Scaling Organization&lt;/strong&gt;\
  \ \u2013 Tackle meaningful work in a high-growth, ever-evolving environment.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Transparent Communication&lt;/strong&gt; \u2013 Expect\
  \ open decision-making and regular company-wide updates.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Innovation-Driven&lt;/strong&gt;\
  \ \u2013 Autonomy and support to ship great work and try new things.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Open Source Roots&lt;/strong&gt; \u2013 Built on community-driven\
  \ values that shape how we work.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Empowered Teams&lt;/strong&gt;\
  \ \u2013 High trust, low ego culture that values outcomes over optics.&lt;/li&gt;\
  \ &lt;li&gt;&lt;strong&gt;Career Growth Pathways&lt;/strong&gt; \u2013 Defined opportunities\
  \ to grow and develop your career.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Approachable\
  \ Leadership&lt;/strong&gt; \u2013 Transparent execs who are involved, visible,\
  \ and human.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Passionate People&lt;/strong&gt;\
  \ \u2013 Join a team of smart, supportive folks who care deeply about what they\
  \ do.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;In-Person onboarding &lt;/strong&gt;- We\
  \ want you to thrive from day 1 with your fellow new \u2018Grafanistas\u2019 to\
  \ learn all about what we do and how we do it.&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Balance\
  \ is Key&lt;/strong&gt; - We operate a global annual leave policy of 30 days per\
  \ annum. 3 days of your annual leave entitlement are reserved for Grafana Shutdown\
  \ Days to allow the team to really disconnect. &lt;em&gt;*We will comply with local\
  \ legislation where applicable.&lt;/em&gt;&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;&lt;strong&gt;Equal\
  \ Opportunity Employer:&lt;/strong&gt; We will recruit, train, compensate and promote\
  \ regardless of race, religion, color, national origin, gender, disability, age,\
  \ veteran status, and all the other fascinating characteristics that make us different\
  \ and unique. We believe that equality and diversity builds a strong organization\
  \ and we\u2019re working hard to make sure that\u2019s the foundation of our organization\
  \ as we grow.&lt;/p&gt; &lt;p&gt;&lt;em data-stringify-type=&quot;italic&quot;&gt;Grafana\
  \ Labs may utilize AI tools in its recruitment process to assist in matching information\
  \ provided in CVs to job postings. The recruitment team will continue to review\
  \ inbound CVs manually to identify alignment with current openings.&lt;/em&gt;&lt;/p&gt;\
  \ &lt;p&gt;#LI-Remote&lt;/p&gt; &lt;/div&gt; &lt;div&gt;&lt;em&gt;For information\
  \ about how your personal data is used once you\u2019ve applied to a job, check\
  \ out our &lt;a href=&quot;https://grafana.com/legal/applicant-and-candidate-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;privacy policy&lt;/a&gt;.&amp;nbsp;&lt;/em&gt;&lt;/div&gt;\
  \ &lt;div&gt;&amp;nbsp;&lt;/div&gt;&lt;/div&gt;"
