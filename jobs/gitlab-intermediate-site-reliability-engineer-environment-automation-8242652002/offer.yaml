    \ and improve the health of every environment. your work will directly impact\
    \ how customers experience gitlab dedicated and other managed offerings, enabling\
    \ them to focus on building software while we ensure their gitlab environments\
    \ are always production ready.&lt;/p&gt; &lt;p&gt;some examples of work you&#39;ll\
    \ do:&lt;/p&gt; &lt;ul&gt; &lt;li value=&quot;1&quot;&gt;contribute to the design\
    \ and evolution of infrastructure automation using terraform, ansible, and kubernetes\
    \ to provision, upgrade, and operate many gitlab environments with minimal manual\
    \ effort&lt;/li&gt; &lt;li value=&quot;2&quot;&gt;help debug and resolve production\
    \ issues across kubernetes clusters, gitlab components, and cloud services, then\
    \ assist in building automation and safeguards that prevent similar issues from\
    \ recurring&lt;/li&gt; &lt;li value=&quot;3&quot;&gt;assist in creating and maintaining\
    \ deployment and orchestration tools, such as helm charts, omnibus-gitlab configurations,\
    \ and multi-tenant workflows, that make it easy for teams to manage gitlab environments\
    \ at scale&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;what you&#39;ll do&lt;/h2&gt; &lt;ul&gt;\
