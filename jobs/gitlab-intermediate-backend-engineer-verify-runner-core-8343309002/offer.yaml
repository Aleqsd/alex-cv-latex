    \ &lt;li&gt;participate in team rotations including bug triage, community contribution\
    \ reviews, and support escalation response.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;what\
    \ you&#39;ll bring&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;proficiency in developing backend\
    \ services in go and applying go best practices in production, whether gained\
    \ through professional work, open-source contributions, or other hands-on experience.&lt;/li&gt;\
    \ &lt;/ul&gt; &lt;ul&gt; &lt;li&gt;ability to design and build scalable, distributed,\
    \ and resilient systems that can grow with increasing demand, ideally with exposure\
