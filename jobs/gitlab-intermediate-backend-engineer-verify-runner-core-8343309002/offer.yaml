job_description_raw: "&lt;div class=&quot;content-intro&quot;&gt;&lt;p&gt;GitLab is\
  \ the intelligent orchestration platform for DevSecOps. GitLab enables organizations\
  \ to increase developer productivity, improve operational efficiency, reduce security\
  \ and compliance risk, and accelerate digital transformation. More than 50 million\
  \ registered users and more than 50% of the Fortune 100* trust GitLab to ship better,\
  \ more secure software faster.&lt;/p&gt; &lt;p&gt;The same principles built into\
  \ our products are reflected in how our team works: we embrace AI as a core productivity\
  \ multiplier, with all team members expected to incorporate AI into their daily\
  \ workflows to drive efficiency, innovation, and impact. GitLab is where careers\
  \ accelerate, innovation flourishes, and every voice is valued. Our high-performance\
  \ culture is driven by our &lt;a href=&quot;https://handbook.gitlab.com/handbook/values/&quot;&gt;values&lt;/a&gt;\
  \ and continuous knowledge exchange, enabling our team members to reach their full\
  \ potential while collaborating with industry leaders to solve complex problems.\
  \ &lt;a href=&quot;https://www.youtube.com/watch?v=OuZIb5zszQI&quot;&gt;Co-create\
  \ the future with us&lt;/a&gt; as we build technology that transforms how the world\
  \ develops software.&lt;/p&gt; &lt;p&gt;*&lt;em&gt;Fortune 500\xAE is a registered\
  \ trademark of Fortune Media IP Limited, used under license. Claim based on GitLab\
  \ data. Fortune 100 refers to the top 20% ranked companies in the 2025 Fortune 500\
  \ list, published in June 2025. Fortune and Fortune Media IP Limited are not affiliated\
  \ with, and do not endorse products or services of GitLab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;An\
  \ overview of this role&lt;/h2&gt; &lt;p&gt;As an Intermediate Backend Engineer\
  \ on our &lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/devops/runner/runner-core/&quot;&gt;Verify:\
  \ Runner Core&lt;/a&gt; group within the &lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/devops/runner/&quot;&gt;Verify:\
  \ Runner&lt;/a&gt; organization, you&#39;ll help build and evolve GitLab Runner,\
  \ the interface between GitLab and our customers&#39; CI infrastructure. Whether\
  \ jobs run on Kubernetes clusters, cloud VMs, or on-premises hardware, GitLab Runner\
  \ makes it happen. Each week, Runners process millions of jobs for GitLab.com, and\
  \ our container images are downloaded hundreds of millions of times.&lt;/p&gt; &lt;p&gt;You&#39;ll\
  \ collaborate on technical initiatives and contribute to design and implementation,\
  \ taking on work that matches your experience while growing your impact over time.\
  \ You&#39;ll learn from how customers use our CI/CD capabilities and use that insight\
  \ to help the team solve real-world scaling and reliability challenges. This input\
  \ can come from bug reports, customer escalations, or feedback on executor behavior\
  \ and performance. GitLab Runner users often have demanding CI/CD requirements,\
  \ and many rely on the infrastructure you help build as a mission-critical part\
  \ of their software delivery workflows.&lt;/p&gt; &lt;p&gt;Here&#39;s a glimpse\
  \ of some of the things we&#39;re working on and where we&#39;re headed:&lt;/p&gt;\
  \ &lt;ul&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/architecture/design-documents/runner_job_router/&quot;&gt;Job\
  \ Routing&lt;/a&gt;: Transforming GitLab Runner&#39;s job scheduling from HTTP polling\
  \ to intelligent, server-mediated routing that enables runner prioritization, admission\
  \ control, and distributed autoscaling coordination.&lt;/li&gt; &lt;ul&gt; &lt;li&gt;We&#39;ve\
  \ already kicked this off with &lt;a href=&quot;https://gitlab.com/groups/gitlab-org/-/work_items/19660&quot;&gt;Admission\
  \ Control&lt;/a&gt;, and you could contribute to its iteration.&lt;/li&gt; &lt;/ul&gt;\
  \ &lt;li&gt;&lt;a href=&quot;https://gitlab.com/gitlab-com/content-sites/handbook/-/merge_requests/16893&quot;&gt;Externalizing\
  \ CI&lt;/a&gt;: Transforming GitLab CI from static YAML configuration to dynamic,\
  \ programmable pipelines where jobs can create other jobs at runtime.&lt;/li&gt;\
  \ &lt;li&gt;&lt;a href=&quot;https://gitlab.com/gitlab-com/content-sites/handbook/-/merge_requests/16402&quot;&gt;Job\
  \ Volume Mounts&lt;/a&gt;: Enabling CI jobs to mount GitLab repositories and artifacts\
  \ as filesystem volumes, providing instant, lightweight access to multi-repository\
  \ content without full git clones.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;What you&#39;ll\
  \ do&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Design and develop features and improvements\
  \ for GitLab Runner that are secure, well-tested, and high-performance, with a focus\
  \ on strong architecture in Go services, appropriate for an intermediate-level engineer.&lt;/li&gt;\
  \ &lt;li&gt;Partner with the Product Manager and other Senior Engineers to assess\
  \ the technical feasibility and scope of Runner-related feature requests, contributing\
  \ your perspective and asking clarifying questions.&lt;/li&gt; &lt;li&gt;Contribute\
  \ to architectural decisions that modernize Runner&#39;s technology stack, favoring\
  \ solutions that address root causes over fixes that treat symptoms.&lt;/li&gt;\
  \ &lt;/ul&gt; &lt;ul&gt; &lt;li&gt;Take end-to-end ownership of your features from\
  \ design through implementation, code review, deployment, monitoring, and iterative\
  \ refinement.&lt;/li&gt; &lt;li&gt;Collaborate closely with other engineers on the\
  \ team and within the Runner Organization through code reviews, pairing, and knowledge\
  \ sharing, both learning from others and helping raise the overall technical bar.&lt;/li&gt;\
  \ &lt;li&gt;Work with cross-functional partners, including Support and Product,\
  \ to help diagnose, troubleshoot, and resolve customer issues related to GitLab\
  \ Runner and CI Functions, and feed those learnings back into the product.&lt;/li&gt;\
  \ &lt;li&gt;Engage with GitLab Runner&#39;s vibrant open-source community by triaging\
  \ bug reports, reviewing community-contributed merge requests, and helping contributors\
  \ succeed.&lt;/li&gt; &lt;li&gt;Participate in team rotations including bug triage,\
  \ community contribution reviews, and support escalation response.&lt;/li&gt; &lt;/ul&gt;\
  \ &lt;h2&gt;What you&#39;ll bring&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;Proficiency in\
  \ developing backend services in Go and applying Go best practices in production,\
  \ whether gained through professional work, open-source contributions, or other\
  \ hands-on experience.&lt;/li&gt; &lt;/ul&gt; &lt;ul&gt; &lt;li&gt;Ability to design\
  \ and build scalable, distributed, and resilient systems that can grow with increasing\
  \ demand, ideally with exposure to high-throughput CI pipelines, job orchestration,\
  \ or similar infrastructure.&lt;/li&gt; &lt;li&gt;Hands-on skills with containerization\
  \ and orchestration technologies such as Docker and Kubernetes, including deploying\
  \ and operating services that run CI workloads across diverse environments.&lt;/li&gt;\
  \ &lt;li&gt;Ability to analyze, profile, and optimize performance in distributed\
  \ systems using appropriate tools and observability data, especially for latency-sensitive\
  \ and resource-intensive CI execution paths.&lt;/li&gt; &lt;li&gt;Familiarity with\
  \ cloud-native infrastructure (for example, a major cloud provider or infrastructure-as-code\
  \ tools) and concepts related to site reliability and operating SaaS platforms that\
  \ run large-scale CI.&lt;/li&gt; &lt;li&gt;Comfort with asynchronous communication\
  \ and proactive written updates, essential for collaborating effectively across\
  \ a globally distributed team.&lt;/li&gt; &lt;li&gt;Strong collaboration skills,\
  \ including working closely with other engineers, contributing to shared technical\
  \ practices, participating in code reviews, and communicating clearly with cross-functional\
  \ partners like Product and Support.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;About the\
  \ team&lt;/h2&gt; &lt;p&gt;The Verify: Runner Core team at GitLab sits within the\
  \ Verify: Runner organization and is responsible for &lt;a href=&quot;https://gitlab.com/gitlab-org/gitlab-runner&quot;&gt;GitLab\
  \ Runner&lt;/a&gt;. We focus on Runner&#39;s core architecture, executor implementations,\
  \ scalability, and reliability. The team operates across multiple time zones, so\
  \ async communication is core to how we work.&lt;/p&gt; &lt;p&gt;We work closely\
  \ with the CI Functions Platform team, within the Runner organization. The two teams\
  \ collaborate regularly and share roadmap initiatives. This close partnership means\
  \ you&#39;ll have opportunities to contribute to work that affects both teams.&lt;/p&gt;\
  \ &lt;div&gt;&lt;span style=&quot;font-size: xx-small;&quot;&gt;&lt;span style=&quot;color:\
  \ white;&quot;&gt;Remote-Global&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;content-conclusion&quot;&gt;&lt;h4&gt;&lt;strong&gt;How\
  \ GitLab will support you&lt;/strong&gt;&lt;/h4&gt; &lt;ul&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/&quot;&gt;Benefits\
  \ to support your health, finances, and well-being&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a\
  \ href=&quot;https://handbook.gitlab.com/handbook/people-group/paid-time-off/&quot;&gt;Flexible\
  \ Paid Time Off&lt;/a&gt;&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/company/culture/inclusion/erg-guide/#:~:text=Definition%20of%20the%20TMRG%20%2D%20Team%20Member%20Resource%20Groups,-TMRGs%20are%20voluntary&amp;amp;text=The%20purpose%20for%20this%20type,developing%20the%20sense%20of%20belonging.&quot;&gt;Team\
  \ Member Resource Groups&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/total-rewards/stock-options/&quot;&gt;Equity\
  \ Compensation &amp;amp; Employee Stock Purchase Plan&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a\
  \ href=&quot;https://handbook.gitlab.com/handbook/people-group/learning-and-development/growth-and-development/&quot;&gt;Growth\
  \ and Development Fund&lt;/a&gt;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://about.gitlab.com/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave&quot;&gt;Parental\
  \ leave&lt;/a&gt;&amp;nbsp;&lt;/li&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/finance/expenses/#equipment&quot;&gt;Home\
  \ office&lt;/a&gt; support&lt;/li&gt; &lt;/ul&gt; &lt;p&gt;Please note that we welcome\
  \ interest from candidates with varying levels of experience; many successful candidates\
  \ do not meet every single requirement. Additionally, studies have shown that people\
  \ from &lt;a href=&quot;https://about.gitlab.com/company/culture/inclusion/#examples-of-select-underrepresented-groups&quot;&gt;underrepresented\
  \ groups&lt;/a&gt; are less likely to apply to a job unless they meet every single\
  \ qualification. If you&#39;re excited about this role, please apply and allow our\
  \ recruiters to assess your application.&lt;/p&gt; &lt;hr&gt; &lt;p&gt;&lt;strong&gt;Country\
  \ Hiring Guidelines: &lt;/strong&gt;GitLab hires new team members in countries around\
  \ the world. All of our roles are remote, however some roles may carry specific\
  \ location-based eligibility requirements. Our Talent Acquisition team can help\
  \ answer any questions about location after starting the recruiting process.&amp;nbsp;&amp;nbsp;&lt;/p&gt;\
  \ &lt;p&gt;&lt;strong&gt;Privacy Policy: &lt;/strong&gt;Please review our &lt;a\
  \ href=&quot;https://handbook.gitlab.com/handbook/hiring/candidate-faq/recruitment-privacy-policy/&quot;\
  \ target=&quot;_blank&quot;&gt;Recruitment Privacy Policy.&lt;/a&gt; Your privacy\
  \ is important to us.&lt;/p&gt; &lt;p&gt;GitLab is proud to be an equal opportunity\
  \ workplace and is an affirmative action employer. GitLab\u2019s policies and practices\
  \ relating to recruitment, employment, career development and advancement, promotion,\
  \ and retirement are based solely on merit, regardless of race, color, religion,\
  \ ancestry, sex (including pregnancy, lactation, sexual orientation, gender identity,\
  \ or gender expression), national origin, age, citizenship, marital status, mental\
  \ or physical disability, genetic information (including family medical history),\
  \ discharge status from the military, protected veteran status (which includes disabled\
  \ veterans, recently separated veterans, active duty wartime or campaign badge veterans,\
  \ and Armed Forces service medal veterans), or any other basis protected by law.\
  \ GitLab will not tolerate discrimination or harassment based on any of these characteristics.\
  \ See also&amp;nbsp;&lt;a href=&quot;https://about.gitlab.com/handbook/people-policies/inc-usa/#equal-employment-opportunity-policy&quot;\
  \ target=&quot;_blank&quot;&gt;GitLab\u2019s EEO Policy&lt;/a&gt;&amp;nbsp;and&amp;nbsp;&lt;a\
  \ href=&quot;https://about.gitlab.com/handbook/labor-and-employment-notices/#eeoc-us-equal-employment-opportunity-commission-notices&quot;\
  \ target=&quot;_blank&quot;&gt;EEO is the Law&lt;/a&gt;. If you have a disability\
  \ or special need that requires&amp;nbsp;&lt;a href=&quot;https://about.gitlab.com/handbook/people-policies/inc-usa/#reasonable-accommodation&quot;\
  \ target=&quot;_blank&quot;&gt;accommodation&lt;/a&gt;, please let us know during\
  \ the&amp;nbsp;&lt;a href=&quot;https://about.gitlab.com/handbook/hiring/interviewing/#adjustments-to-our-interview-process&quot;\
  \ target=&quot;_blank&quot;&gt;recruiting process&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;"
