    \ of gitlab.&lt;/em&gt;&lt;/p&gt;&lt;/div&gt;&lt;h2&gt;an overview of this role&lt;/h2&gt;\
    \ &lt;p&gt;as an intermediate backend engineer on our &lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/devops/runner/runner-core/&quot;&gt;verify:\
    \ runner core&lt;/a&gt; group within the &lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/devops/runner/&quot;&gt;verify:\
    \ runner&lt;/a&gt; organization, you&#39;ll help build and evolve gitlab runner,\
    \ the interface between gitlab and our customers&#39; ci infrastructure. whether\
    \ jobs run on kubernetes clusters, cloud vms, or on-premises hardware, gitlab\
    \ runner makes it happen. each week, runners process millions of jobs for gitlab.com,\
    \ and our container images are downloaded hundreds of millions of times.&lt;/p&gt;\
    \ &lt;p&gt;you&#39;ll collaborate on technical initiatives and contribute to design\
    \ and implementation, taking on work that matches your experience while growing\
    \ your impact over time. you&#39;ll learn from how customers use our ci/cd capabilities\
    \ and use that insight to help the team solve real-world scaling and reliability\
    \ challenges. this input can come from bug reports, customer escalations, or feedback\
    \ on executor behavior and performance. gitlab runner users often have demanding\
    \ ci/cd requirements, and many rely on the infrastructure you help build as a\
    \ mission-critical part of their software delivery workflows.&lt;/p&gt; &lt;p&gt;here&#39;s\
    \ a glimpse of some of the things we&#39;re working on and where we&#39;re headed:&lt;/p&gt;\
    \ &lt;ul&gt; &lt;li&gt;&lt;a href=&quot;https://handbook.gitlab.com/handbook/engineering/architecture/design-documents/runner_job_router/&quot;&gt;job\
    \ routing&lt;/a&gt;: transforming gitlab runner&#39;s job scheduling from http\
    \ polling to intelligent, server-mediated routing that enables runner prioritization,\
    \ admission control, and distributed autoscaling coordination.&lt;/li&gt; &lt;ul&gt;\
    \ &lt;li&gt;we&#39;ve already kicked this off with &lt;a href=&quot;https://gitlab.com/groups/gitlab-org/-/work_items/19660&quot;&gt;admission\
    \ control&lt;/a&gt;, and you could contribute to its iteration.&lt;/li&gt; &lt;/ul&gt;\
    \ &lt;li&gt;&lt;a href=&quot;https://gitlab.com/gitlab-com/content-sites/handbook/-/merge_requests/16893&quot;&gt;externalizing\
    \ ci&lt;/a&gt;: transforming gitlab ci from static yaml configuration to dynamic,\
    \ programmable pipelines where jobs can create other jobs at runtime.&lt;/li&gt;\
    \ &lt;li&gt;&lt;a href=&quot;https://gitlab.com/gitlab-com/content-sites/handbook/-/merge_requests/16402&quot;&gt;job\
